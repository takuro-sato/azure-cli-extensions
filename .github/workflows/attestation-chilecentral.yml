name: Attestation - Chile Central

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '8 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-chilecentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: chilecentral
      policy_type: allow_all
