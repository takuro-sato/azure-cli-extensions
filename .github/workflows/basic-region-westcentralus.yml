name: Region (Basic) - West Central US

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-westcentralus.yml
  schedule:
    - cron: '43 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-westcentralus:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: westcentralus
