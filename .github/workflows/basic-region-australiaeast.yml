name: Region (Basic) - Australia East

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-australiaeast.yml
  schedule:
    - cron: '1 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-australiaeast:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: australiaeast
