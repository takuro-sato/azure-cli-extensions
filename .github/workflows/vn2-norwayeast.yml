name: VN2 - Norway East

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '55 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-norwayeast:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: norwayeast
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-norwayeast
