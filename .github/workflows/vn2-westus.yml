name: VN2 - West US

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '13 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-westus:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: westus
      resource_group: vn2-aks-westus
      aks_cluster_name: vn2-aks-westus
