name: Attestation - Poland Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-polandcentral.yml
  schedule:
    - cron: '31 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-polandcentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: polandcentral
      policy_type: allow_all
      test_schedule: gh-hourly
