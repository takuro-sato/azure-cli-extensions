name: Region (Basic) - South Africa North

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-southafricanorth.yml
  schedule:
    - cron: '33 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-southafricanorth:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: southafricanorth
