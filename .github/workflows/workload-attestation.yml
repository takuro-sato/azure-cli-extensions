name: Workload - Attestation

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/attestation/**
      - .github/workflows/workload-attestation.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/attestation/**
      - .github/workflows/workload-attestation.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 1
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 1
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      attestation_endpoint:
        type: string
        description: The MAA endpoint host name, or empty to use regional default
        default: ''
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 1
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 1
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      attestation_endpoint:
        type: string
        description: The MAA endpoint host name, or empty to use regional default
        default: ''
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Attestation
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'attestation' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboard.azurecr.io
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 1 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 1 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}
  TAG: "2.12"
  ATTESTATION_ENDPOINT: ${{ inputs.attestation_endpoint }}
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: ''

jobs:
  attestation:
    name: ${{ inputs.id || 'attestation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Pull Image
        if: ${{ env.POLICY_TYPE != 'allow_all' }}
        run: c-aci-testing images pull workloads/attestation

      - name: Set Attestation Endpoint
        if: ${{ env.ATTESTATION_ENDPOINT == '' }}
        run: |
          ATTESTATION_ENDPOINT=$(cat azure/MAA-endpoints.csv | grep -vE '^#|^$' | grep -E ',${{ env.LOCATION }},' | cut -d, -f3)
          if [ -z "$ATTESTATION_ENDPOINT" ]; then
            echo "No MAA endpoint found for location ${{ env.LOCATION }}"
            exit 1
          fi
          # Strip https:// and trailing slash
          ATTESTATION_ENDPOINT=${ATTESTATION_ENDPOINT#https://}
          ATTESTATION_ENDPOINT=${ATTESTATION_ENDPOINT%/}
          echo "Using MAA endpoint: $ATTESTATION_ENDPOINT"
          echo "ATTESTATION_ENDPOINT=$ATTESTATION_ENDPOINT" >> $GITHUB_ENV

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/attestation --parameter \
            cpu=$CPU \
            memoryInGb=$MEMORY_IN_GB \
            attestationEndpoint=$ATTESTATION_ENDPOINT

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/attestation --deployment-name $DEPLOYMENT_NAME
          cat workloads/attestation/policy_attestation.rego

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/attestation

      - name: Get MAA Token
        run: |
          ./scripts/tracing/trace_step.py --start 'Get MAA Token'
          container_logs=$(az container logs \
            --resource-group $RESOURCE_GROUP \
            --name $DEPLOYMENT_NAME \
            --container-name primary)

          token=$(echo $container_logs | jq -r '.token')
          if [ -z "$token" ] || [ "$token" == null ]; then
            echo "Token field is empty, null or missing in the response"
            exit 1
          else
            echo "Token successfully acquired from MAA: $token"
          fi

          echo "Attempting to parse token to extract UVM compliance"

          echo "Splitting token into header/payload/signature by . delimiter..."
          IFS='.' read -r header payload signature <<< "$token"
          echo "Successfully split token:"
          echo "header=$header"
          echo "payload=$payload"
          echo "signature=$signature"

          echo "Base64 decoding payload..."
          payload=$(echo "$payload" | tr '_-' '/+' | awk '{
              padding = (4 - length($0) % 4) % 4;
              for(i = 0; i < padding; i++) $0 = $0 "=";
              print
          }' | base64 -d 2>/dev/null)
          echo "Base64 decoding payload done:"
          echo "payload=$payload"
          azure_compliance_status=$(echo "$payload" | jq -r '."x-ms-compliance-status"')
          if [ "$azure_compliance_status" != "azure-compliant-uvm" ]; then
            echo "UVM isn't Azure Compliant"
            exit 1
          else
            echo "UVM is Azure Compliant"
          fi

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
