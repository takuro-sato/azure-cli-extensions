name: Region - Italy North

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '40 4 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/region-italynorth.yml

jobs:
  italynorth:
    secrets: inherit
    uses: ./.github/workflows/region.yml
    with:
      location: italynorth
