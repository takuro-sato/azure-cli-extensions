name: Perf - Central US EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-centraluseuap.yml

jobs:
  perf-centraluseuap:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: centraluseuap
