name: Workload - Many Layers C-WCOW

# Confidential WCOW many-layers workload.
#
# Deploys the dedicated many-layers-cwcow image, which adds 20 non-empty
# filesystem layers above Nano Server, and asserts that it mounts and boots.
#
# C-WCOW constraints (same as the other *-cwcow workflows):
#   * This workload does not expose a vnet option.
#   * Policy type is always 'allow_all' — generated WCOW policies need confcom
#     1.3.0+wcow and Windows Docker, unavailable on ubuntu-latest.
#   * REGISTRY/REPOSITORY/TAG are REAL here (image pulled from our ACR, anonymous
#     pull enabled) and are param_set onto the bicep.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      tag:
        type: string
        description: Image tag (e.g. a YYYYMMDD tag during branch validation, or latest)
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      tag:
        type: string
        description: Image tag (e.g. a YYYYMMDD tag during branch validation, or latest)
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Many Layers C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKLOAD: workloads/many_layers_cwcow
  DEPLOYMENT_NAME: ${{ inputs.id || 'many-layers-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  TAG: ${{ inputs.tag || 'latest' }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 4 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 8 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  many-layers-cwcow:
    name: ${{ inputs.id || 'many-layers-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set $WORKLOAD --parameter cpu=$CPU
          c-aci-testing aci param_set $WORKLOAD --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set $WORKLOAD --parameter registry=$REGISTRY
          c-aci-testing aci param_set $WORKLOAD --parameter tag=$TAG

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen $WORKLOAD --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh $WORKLOAD

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          sleep 120
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
          cat output.log | jq -R -s '{many_layers_cwcow: .}' | ./scripts/tracing/trace_step.py --complete --strict --output-from-stdin

      - name: 'Check many_layers_cwcow log contains expected marker'
        run: |
          ./scripts/tracing/trace_step.py --start 'Check many_layers_cwcow log'
          if ! grep -q '===MANY_LAYERS_OK===' output.log; then
            ./scripts/tracing/trace_step.py --complete --err 'many_layers_cwcow log missing ===MANY_LAYERS_OK==='
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete --strict

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
