name: Uptime - South Central US

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '40 6 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/uptime-southcentralus.yml

jobs:
  uptime:
    secrets: inherit
    uses: ./.github/workflows/uptime.yml
    with:
      location: southcentralus
