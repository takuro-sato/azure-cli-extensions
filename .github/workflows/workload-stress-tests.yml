name: Workload - Stress Tests

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/stress_tests
      - .github/workflows/workload-stress-tests.yml
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/stress_tests
      - .github/workflows/workload-stress-tests.yml
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in each container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      script:
        type: choice
        description: The script to run
        default: workload_fio
        options:
          - workload_cpu
          - workload_cpu_fio
          - workload_exec
          - workload_fio
          - workload_multicpu_fio
          - workload_tar
      useNormalSidecar:
        type: boolean
        default: false
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in each container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      script:
        type: string
        description: The script to run
        default: workload_fio
      useNormalSidecar:
        type: boolean
        default: true

env:
  DEPLOYMENT_NAME: ${{ inputs.id || 'stress-tests' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboard.azurecr.io
  MANAGED_IDENTITY: cacidashboard
  LOCATION: ${{ inputs.location || 'westus' }}
  CPU: ${{ inputs.cpu || 4 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}
  SCRIPT: ${{ inputs.script || 'workload_fio' }}
  REPO_BASE: stress_tests
  USE_NORMAL_SIDECAR: ${{ inputs.useNormalSidecar || true }}

jobs:
  stress-tests:
    name: ${{ inputs.id || 'stress-tests' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Install c_aci_testing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-c-aci-testing.sh

      - name: Set Confcom Version
        run: az extension add -n confcom --version 1.1.1 --upgrade

      - name: Setup Docker
        run: sudo usermod -aG docker $USER

      - name: Use precise current time as tag
        run: |
          TAG=$(date "+%Y%m%d-%H%M%S.%N")
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build image
        run: c-aci-testing images build workloads/stress_tests

      - name: Push image
        run: c-aci-testing images push workloads/stress_tests

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/stress_tests --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/stress_tests --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set workloads/stress_tests --parameter "script='$SCRIPT'"
          c-aci-testing aci param_set workloads/stress_tests --parameter "repo_base='$REPO_BASE'"
          c-aci-testing aci param_set workloads/stress_tests --parameter "useNormalSidecar=$USE_NORMAL_SIDECAR"
          echo stress_tests.bicepparam:
          cat workloads/stress_tests/stress_tests.bicepparam

      - name: Generate Security Policy
        run: |
          c-aci-testing policies gen workloads/stress_tests --deployment-name $DEPLOYMENT_NAME
          cat workloads/stress_tests/policy_stress_tests.rego

      - name: Deploy Container Group
        run: c-aci-testing aci deploy workloads/stress_tests --deployment-name $DEPLOYMENT_NAME

      - name: Wait for IP address
        run: |
          ip_address=""
          elapsed=0
          while [[ -z "$ip_address" && elapsed -lt 60 ]]; do
            ip_address=$(c-aci-testing aci get ips --deployment-name $DEPLOYMENT_NAME | sed "s/\['\([^']*\)'\]/\1/")
            echo "IP Address: $ip_address"
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "ip_address=$ip_address" >> $GITHUB_ENV

      - name: Curl Server
        run: |
          sleep 1
          echo "Attempting to send a request..."

          set +e
          attempts=0
          while [ $attempts -lt 5 ]; do
            # We want to limit the total amount of time this curl command can run for,
            # rather than just connect time, so that if the server accepts the request
            # but then hangs we also exit. This necessitates the use of `timeout`.
            timeout -s INT 20 curl --fail-with-body http://$ip_address:8000/index.txt
            status=$?
            if [ $status -eq 0 ]; then
              break
            fi
            attempts=$((attempts + 1))
            echo "Attempt $attempts failed"
            if [ $attempts -lt 5 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done
          if [ $attempts -ne 0 ]; then
            echo "curl failed $attempts times"
            exit 1
          fi
          exit 0

      - name: Let container run for 1min and test again
        run: |
          sleep 100
          timeout -s INT 1m curl --fail-with-body http://$ip_address:8000/index.txt || exit 1

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          az container show \
            --resource-group $RESOURCE_GROUP \
            --name $DEPLOYMENT_NAME \
          | jq -c '.containers[]' | while read -r container; do
            container_name=$(echo "$container" | jq -r '.name')
            echo "Events for container $container_name:"
            echo "$container" | jq -r '.instanceView | .events[]'
          done

      - name: Check dmesg
        if: always()
        run: |
            dmesg_file="dmesg.log"

            timeout -s INT 1m curl --fail-with-body http://$ip_address:8000/dmesg.log -o $dmesg_file
            if [ $? -ne 0 ]; then
              echo "Failed to get dmesg:"
              cat $dmesg_file
              exit 1
            fi

            found_sus_message=""
            grep -F '] hv_storvsc' $dmesg_file && found_sus_message="hv_storvsc"
            grep -i segfault $dmesg_file && found_sus_message="segfault"
            grep -i 'protection fault' $dmesg_file && found_sus_message="protection-fault"
            grep 'BUG:' $dmesg_file && found_sus_message="kernel-bug"
            grep 'RIP:' $dmesg_file && found_sus_message="kernel-backtrace"

            cat $dmesg_file

            if [ -n "$found_sus_message" ]; then
              echo "Found suspicious message in dmesg: $found_sus_message"
              exit 1
            fi

            if [ ! -s $dmesg_file ]; then
              echo "No dmesg output found"
              exit 1
            fi

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
