name: VN2 - Southeast Asia

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '8 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-southeastasia:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: southeastasia
      resource_group: vn2-aks-southeastasia
      aks_cluster_name: vn2-aks-southeastasia
