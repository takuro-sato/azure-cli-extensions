name: Merge multi-arch container manifests

# Runs after either arch build completes, merging the arch-specific tags
# (:TAG-linux-amd64, :TAG-linux-arm64) into a single multi-arch :TAG manifest.
# If one arch tag hasn't been pushed yet, merge_manifests skips that platform
# and keeps retrying on subsequent runs until both arch tags exist.
on:
  workflow_run:
    workflows:
      - "Build and push test containers"
      - "Build and push test containers (arm64)"
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to merge (default: today's date YYYYMMDD)"
        required: false

permissions:
  id-token: write
  contents: read

env:
  DOCKER_BUILDKIT: 1
  REGISTRY: cacidashboardaci.azurecr.io
  REPOSITORY: prebuilt-test-containers

jobs:
  merge:
    # Only run when the triggering build workflow succeeded (or on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Login to ACR
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Resolve tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(date "+%Y%m%d")
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Merge arch-specific tags into multi-arch manifest
        run: |
          cd containers && make REGISTRY=$REGISTRY REPOSITORY=$REPOSITORY TAG=$TAG merge_manifests

      - name: Merge latest (main branch only)
        if: ${{ github.event.workflow_run.head_branch == 'main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        run: |
          cd containers && make REGISTRY=$REGISTRY REPOSITORY=$REPOSITORY TAG=latest merge_manifests
