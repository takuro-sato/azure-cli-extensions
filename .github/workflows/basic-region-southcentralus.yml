name: Region (Basic) - South Central US

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-southcentralus.yml
  schedule:
    - cron: '29 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-southcentralus:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: southcentralus
