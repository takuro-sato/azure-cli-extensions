name: Workload - Info C-WCOW

# Confidential WCOW equivalent of workload-info.yml.
#
# Deploys workloads/info_cwcow as a confidential ACI container group on the
# target region's ACISNP cluster fleet, then verifies the one-shot info dump
# (hostname, ver, env) completes.
#
# Differences vs workload-info.yml:
#   * No registry/repository/tag plumbing — image is a digest-pinned
#     mcr.microsoft.com/windows/nanoserver, pulled by the host at deploy time.
#   * No image pull step (no ACR involved).
#   * Policy type is always 'allow_all' — `c-aci-testing policies gen
#     --policy-type generated` for WCOW requires confcom 1.3.0+wcow and
#     Windows Docker (not available on ubuntu-latest). See vm-cwcow.yml for
#     the same rationale.
#   * No require_host_amd_cert / expect_uvm_signature inputs — the cwcow info
#     workload does not run info_check.sh; it's just a cmd.exe dump of
#     hostname/version/env, terminated with ===EOF===.
#   * No useVnet / zone params — info_cwcow.bicep does not declare them
#     today. If we need vnet/zoned variants on AUC2 later we'll extend the
#     bicep first.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Info C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'info-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  # WCOW workloads pull from mcr.microsoft.com (image is digest-pinned in
  # bicep). REGISTRY is set only because c-aci-testing's argparse rejects a
  # missing --registry even for --policy-type allow_all; the value is never
  # actually used by the WCOW workloads.
  REGISTRY: cacidashboardaci.azurecr.io
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  info-cwcow:
    name: ${{ inputs.id || 'info-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/info_cwcow --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/info_cwcow --parameter memoryInGb=$MEMORY_IN_GB

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/info_cwcow --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/info_cwcow

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          sleep 120
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
          cat output.log | jq -R -s '{info_cwcow: .}' | ./scripts/tracing/trace_step.py --complete --strict --output-from-stdin

      - name: 'Check info_cwcow log contains expected markers'
        run: |
          ./scripts/tracing/trace_step.py --start 'Check info_cwcow log'
          ok=1
          grep -q '===HOSTNAME===' output.log || ok=0
          grep -q '===EOF===' output.log || ok=0
          if [ $ok -ne 1 ]; then
            ./scripts/tracing/trace_step.py --complete --err 'info_cwcow log missing ===HOSTNAME=== or ===EOF==='
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete --strict

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
