name: Workload - Info C-WCOW

# Confidential WCOW equivalent of workload-info.yml.
#
# Deploys workloads/info_cwcow as a confidential ACI container group on the
# target region's ACISNP cluster fleet, then verifies the one-shot info +
# attestation dump completes.
#
# The image is our repo-prebuilt `info-cwcow` (built by
# build-test-containers.yaml), which embeds psputilgo.exe and runs attest.py.
# Per micromaomao's PR #332 review, info_cwcow now mirrors the LCOW `info`
# container: it dumps guest info AND fetches a raw AMD SEV-SNP attestation
# report locally, emitting both the legacy ===HOSTNAME===/===EOF=== markers
# (asserted below) and an `OUTPUT: {json}` line (scraped into Kusto by
# scripts/parse_container_output.py).
#
# Differences vs workload-info.yml:
#   * REGISTRY/REPOSITORY/TAG are REAL — the image is pulled from our ACR
#     (anonymous pull enabled) and param_set onto the bicep. During branch
#     validation, before `latest` is published on main, pass a YYYYMMDD tag.
#   * Policy type is always 'allow_all' — `c-aci-testing policies gen
#     --policy-type generated` for WCOW requires confcom 1.3.0+wcow and
#     Windows Docker (not available on ubuntu-latest). See vm-cwcow.yml for
#     the same rationale.
#   * No require_host_amd_cert / expect_uvm_signature inputs.
#   * VNet injection uses the same existing regional VNet/subnet as LCOW info.
#   * No zone parameter yet.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      tag:
        type: string
        description: Image tag (e.g. a YYYYMMDD tag during branch validation, or latest)
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      tag:
        type: string
        description: Image tag (e.g. a YYYYMMDD tag during branch validation, or latest)
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Info C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'info-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  # The image is our repo-prebuilt info-cwcow, pulled from the registry
  # selected by the environment. The Bicep supplies its repository default.
  TAG: ${{ inputs.tag || 'latest' }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  USE_VNET: ${{ inputs.use_vnet || false }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: ${{ inputs.use_vnet && 'vnet' || '' }}

jobs:
  info-cwcow:
    name: ${{ inputs.id || 'info-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/info_cwcow --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/info_cwcow --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set workloads/info_cwcow --parameter useVnet=$USE_VNET
          c-aci-testing aci param_set workloads/info_cwcow --parameter registry=$REGISTRY
          c-aci-testing aci param_set workloads/info_cwcow --parameter tag=$TAG

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/info_cwcow --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/info_cwcow

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          time=0
          # Confidential WCOW pods boot slower than LCOW, and psputilgo's report
          # fetch adds latency; give it a wide window before reading OUTPUT.
          while [ $time -lt 20 ]; do
            sleep 15
            c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
            if grep -q 'OUTPUT: ' output.log; then
              break
            fi
            time=$((time + 1))
          done
          cat output.log | jq -R -s '{info_cwcow: .}' | ./scripts/tracing/trace_step.py --complete --strict --output-from-stdin

      - name: 'Check info_cwcow log contains expected markers'
        run: |
          ./scripts/tracing/trace_step.py --start 'Check info_cwcow log'
          ok=1
          grep -q '===HOSTNAME===' output.log || ok=0
          grep -q '===EOF===' output.log || ok=0
          if [ $ok -ne 1 ]; then
            ./scripts/tracing/trace_step.py --complete --err 'info_cwcow log missing ===HOSTNAME=== or ===EOF==='
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete --strict

      - name: Parse output
        if: always()
        run: |
          ./scripts/parse_container_output.py --must-have-output --fail-on-error output.log

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
