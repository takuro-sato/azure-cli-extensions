name: High Spec - West US

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '50 6 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/high-spec-westus.yml
      - .github/workflows/high-spec.yml

jobs:
  high-spec-westus:
    uses: ./.github/workflows/high-spec.yml
    secrets: inherit
    with:
      location: westus
