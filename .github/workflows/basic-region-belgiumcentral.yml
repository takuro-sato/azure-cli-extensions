name: Region (Basic) - Belgium Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-belgiumcentral.yml
  schedule:
    - cron: '4 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-belgiumcentral:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: belgiumcentral
