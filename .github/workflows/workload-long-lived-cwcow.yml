name: Workload - Long Lived C-WCOW

# Confidential WCOW equivalent of workload-long-lived.yml.
#
# Deploys workloads/long_lived_cwcow as a confidential WCOW container group on
# the target region's ACISNP fleet. The container runs forever
# (`ping -t 127.0.0.1`) with restartPolicy OnFailure, so there is no completion
# sentinel to grep — exactly like the LCOW long_lived workload, the meaningful
# assertion is that the deploy step succeeds and the container reaches a running
# state. The Monitor step is informational (continue-on-error).
#
# Same C-WCOW constraints as workload-info-cwcow.yml: digest-pinned image, no
# ACR pull, policy_type always allow_all, dummy REGISTRY for argparse.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 1
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 2
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 1
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 2
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Long Lived C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'long-lived-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  # WCOW workloads pull from mcr.microsoft.com (image is digest-pinned in
  # bicep). REGISTRY is set only because c-aci-testing's argparse rejects a
  # missing --registry even for --policy-type allow_all; the value is never
  # actually used by the WCOW workloads.
  REGISTRY: cacidashboardaci.azurecr.io
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 1 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 2 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  long-lived-cwcow:
    name: ${{ inputs.id || 'long-lived-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/long_lived_cwcow --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/long_lived_cwcow --parameter memoryInGb=$MEMORY_IN_GB

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/long_lived_cwcow --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/long_lived_cwcow

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
