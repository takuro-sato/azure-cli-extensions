name: VM - East US

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vm-eastus.yml

jobs:
  vm-eastus:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: eastus
