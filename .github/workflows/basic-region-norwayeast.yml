name: Region (Basic) - Norway East

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-norwayeast.yml
  schedule:
    - cron: '30 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-norwayeast:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: norwayeast
