name: VM Unified

# Combined single-VM confidential test: proves that ONE confidential VM running
# the unified cplat package (cri-containerd-confidential-0.0.2-unified.zip) hosts
# BOTH confidential runtimes back-to-back:
#   * C-LCOW  - workloads/info        (Linux container, lcow-v2 shim)
#   * C-WCOW  - workloads/minimal_cwcow + info_cwcow (Windows UVM, runhcs-v1 shim)
#
# The unified package bundles both UVMs + both shims in one package.zip
# (LinuxBootFiles\ + WindowsBootFiles\Confidential\), so no separate uvmBlobName
# is needed. Mirrors vm-cwcow.yml's VM provisioning (same nightly host image,
# DC8as_cc_v5, allow_all policy); the only addition is a C-LCOW workload on the
# same host.
#
# Pods are stopped between workloads (scripts/vm_stop_pod.sh): every confidential
# sandbox reserves a large fixed UVM memory allocation, so accumulating them
# exhausts the single DC8as_cc_v5 VM. We keep at most one UVM resident at a time.
#
# Policy type is fixed to allow_all (generated WCOW policy needs confcom
# 1.3.0+wcow + Windows Docker, unavailable on ubuntu-latest).
#
# IMPORTANT: CPLAT_BLOB_NAME must point to a UNIFIED cri-containerd package that
# supports both confidential LCOW and WCOW, packaged in the bootstrap-consumable
# form (gzip-tar with a containerplat_build/ top dir + a deploy.exe that runs
# bare). Override via workflow_dispatch if needed.

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/vm-unified.yml
      - 'workloads/info/**'
      - 'workloads/*_cwcow/**'
      - 'workloads/*_cwcow_*/**'
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
      - scripts/vm_print_info.sh
      - scripts/vm_check_container_output.sh
      - scripts/vm_stop_pod.sh
      - scripts/vm_create_traced.sh
  push:
    paths:
      - .github/workflows/vm-unified.yml
      - 'workloads/info/**'
      - 'workloads/*_cwcow/**'
      - 'workloads/*_cwcow_*/**'
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
      - scripts/vm_print_info.sh
      - scripts/vm_check_container_output.sh
      - scripts/vm_stop_pod.sh
      - scripts/vm_create_traced.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The zone to deploy to
        required: false
        default: ''
      vmImage:
        type: string
        description: The Atlas image to use for the VM (confidential WCOW capable)
        required: false
        default: ''
      vmSize:
        type: string
        description: The size of the VM
        default: Standard_DC8as_cc_v5
      cleanup:
        type: boolean
        description: Whether to cleanup the VM after testing
        default: true
      cplatBlobName:
        type: string
        description: Name of the unified containerplat blob (LCOW + WCOW support)
        default: ''
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The zone to deploy to
        required: false
        default: ''
      vmImage:
        type: string
        description: The Atlas image to use for the VM (confidential WCOW capable)
        required: false
        default: ''
      vmSize:
        type: string
        description: The size of the VM
        default: Standard_DC8as_cc_v5
      cleanup:
        type: boolean
        description: Whether to cleanup the VM after testing
        default: true
      cplatBlobName:
        type: string
        description: Name of the unified containerplat blob (LCOW + WCOW support)
        default: ''
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: vm
  TEST_NAME: VM Unified
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'vm-unified' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  STORAGE_ACCOUNT: cacitestingstorageaci
  # The LCOW info workload uses the shared prebuilt Linux image (registry/
  # repository/tag). WCOW workloads pull Windows images (digest-pinned in bicep
  # for minimal_cwcow; mcr-by-tag for info_cwcow). REGISTRY is required because
  # c-aci-testing's argparse rejects a missing --registry even for allow_all.
  REGISTRY: cacidashboardaci.azurecr.io
  REPOSITORY: prebuilt-test-containers
  TAG: latest
  LOCATION: ${{ inputs.location || 'westeurope' }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  VM_SIZE: ${{ inputs.vmSize || 'Standard_DC8as_cc_v5' }}
  # Track the latest NightlyOSImage (lt_release_svc_prod1), same as vm-cwcow.yml:
  # confidential WCOW depends on bleeding-edge hypervisor bits, so tracking
  # 'latest' is deliberate to surface regressions from new Windows images. The CI
  # federated identity needs Reader on the NightlyOSImage gallery in 824db9f9-...
  VM_IMAGE: ${{ inputs.vmImage || '/subscriptions/824db9f9-0ff1-49f2-ab3e-4b72dfb9dd6a/resourceGroups/cwcow-automation/providers/Microsoft.Compute/galleries/NightlyOSImage/images/lt_release_svc_prod1/versions/latest' }}
  USE_OFFICIAL_IMAGES: ''
  # Unified package: bundles BOTH runtimes + both UVMs. Must be in the
  # bootstrap-consumable form (gzip-tar + containerplat_build/ + bare-runnable
  # deploy.exe).
  CPLAT_BLOB_NAME: ${{ inputs.cplatBlobName || 'cri-containerd-confidential-0.0.2-unified.zip' }}
  WIN_FLAVOR: 'ws2025'
  VM_ZONE: ${{ inputs.zone || '' }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  vm-unified:
    name: ${{ inputs.id || 'vm-unified' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Downgrade Azure CLI
        env:
          AZ_CLI_VERSION: "2.81.0"
        run: ./scripts/install-az-cli.sh

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Pull LCOW image
        run: c-aci-testing images pull workloads/info

      - name: Generate Security Policies
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policies'
          c-aci-testing policies gen workloads/info --deployment-name $DEPLOYMENT_NAME --policy-type allow_all
          for wl in minimal_cwcow info_cwcow; do
            c-aci-testing policies gen workloads/$wl --deployment-name $DEPLOYMENT_NAME --policy-type allow_all
          done

      - name: Deploy VM
        run: ./scripts/vm_create_traced.sh

      - name: Print info
        run: scripts/vm_print_info.sh

      # ---------- C-LCOW half: Linux container in an LCOW UVM ----------

      - name: 'C-LCOW - info'
        env:
          STEP_PREFIX: 'lcow_info'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing aci param_set workloads/info --parameter 'requireHostAmdCert=false'
          c-aci-testing vm runc workloads/info --deployment-name $DEPLOYMENT_NAME --prefix lcow_info

      - name: 'C-LCOW - info check output'
        env:
          STEP_PREFIX: 'lcow_info'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q 'info: success' container_output.log || { echo "missing 'info: success' in LCOW info output"; exit 1; }

      - name: 'C-LCOW - info stop pod'
        env:
          STEP_PREFIX: 'lcow_info'
        run: ./scripts/vm_stop_pod.sh

      # ---------- C-WCOW half: Windows containers in a WCOW UVM ----------

      - name: 'C-WCOW - minimal_cwcow'
        env:
          STEP_PREFIX: 'minimal_cwcow'
          # minimal_cwcow pins nanoserver by digest only when tag is empty; the
          # workflow-level TAG (needed by the LCOW info image) would otherwise
          # force the broken 'nanoserver:latest' linux/amd64 resolution. Override
          # back to empty here so the digest pin is used.
          TAG: ''
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing vm runc workloads/minimal_cwcow --deployment-name $DEPLOYMENT_NAME --prefix minimal_cwcow

      - name: 'C-WCOW - minimal_cwcow check output'
        env:
          STEP_PREFIX: 'minimal_cwcow'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q 'hello c-wcow' container_output.log || { echo "missing 'hello c-wcow' in minimal_cwcow output"; exit 1; }

      - name: 'C-WCOW - minimal_cwcow stop pod'
        env:
          STEP_PREFIX: 'minimal_cwcow'
        run: ./scripts/vm_stop_pod.sh

      - name: 'C-WCOW - info_cwcow'
        env:
          STEP_PREFIX: 'info_cwcow'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          # --no-resolve-manifest-hash: info_cwcow uses a Windows-only image by
          # tag; without this, vm runc pre-resolves via linux/amd64 and fails
          # (see vm-cwcow.yml / handbook F33). Safe under allow_all.
          c-aci-testing vm runc workloads/info_cwcow --deployment-name $DEPLOYMENT_NAME --prefix info_cwcow --no-resolve-manifest-hash

      - name: 'C-WCOW - info_cwcow check output'
        env:
          STEP_PREFIX: 'info_cwcow'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q '===HOSTNAME===' container_output.log || { echo "missing ===HOSTNAME=== marker"; exit 1; }
          grep -q '===EOF===' container_output.log || { echo "missing ===EOF=== marker (info dump did not complete)"; exit 1; }

      - name: 'C-WCOW - info_cwcow stop pod'
        env:
          STEP_PREFIX: 'info_cwcow'
        run: ./scripts/vm_stop_pod.sh

      # ---------- Cleanup ----------

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Remove VM
        if: always()
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing vm remove --deployment-name $DEPLOYMENT_NAME
            # Don't leave VM hanging around even if deployment disappears
            az vm delete \
              --resource-group $RESOURCE_GROUP \
              --name ${DEPLOYMENT_NAME}-vm \
              --yes --force-deletion yes --verbose || true
          fi
