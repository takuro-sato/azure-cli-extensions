name: Perf - Central India

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-centralindia.yml

jobs:
  perf-centralindia:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: centralindia
