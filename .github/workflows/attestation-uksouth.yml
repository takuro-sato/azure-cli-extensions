name: Attestation - UK South

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-uksouth.yml
  schedule:
    - cron: '39 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-uksouth:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: uksouth
      policy_type: allow_all
      test_schedule: gh-hourly
