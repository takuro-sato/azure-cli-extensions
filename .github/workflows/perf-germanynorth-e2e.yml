name: Perf - Germany North E2E

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '15 19 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/perf-germanynorth-e2e.yml

jobs:
  perf-germanynorth-e2e:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: germanynorth
      environment: cacitesting.e2e.env
