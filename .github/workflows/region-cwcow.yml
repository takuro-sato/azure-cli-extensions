name: Region C-WCOW

# Confidential WCOW equivalent of region.yml. Full per-region C-WCOW coverage:
# fans out to every confidential WCOW dashboard workload in sequence on a single
# region's ACISNP fleet.
#
# Jobs run sequentially (chained via `needs`) to avoid contending for the
# region's confidential WCOW capacity — the AUC2 ACISNP fleet is small and the
# elevated stress workload alone asks for 8 CPU / 16 GB.
#
# Every job uses policy_type allow_all (generated WCOW policies need confcom
# 1.3.0+wcow + Windows Docker, unavailable on ubuntu-latest — see vm-cwcow.yml),
# so there is no policy_type matrix like region.yml has for LCOW.

permissions:
  id-token: write
  contents: read

# Reusable only -- WCOW container groups need a region whose ACISNP clusters
# carry the unified-l2bridge cplat (e.g. australiacentral2 today). Defaulting a
# path-triggered run to westeurope fails with UnsupportedWindowsVersion.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      location:
        type: string
        required: true
        description: 'The location of the Azure Container Instances'
      tag:
        type: string
        required: false
        default: latest
        description: 'Prebuilt C-WCOW image tag (a YYYYMMDD tag during validation, or latest)'
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      location:
        type: string
        required: true
        description: 'The location of the Azure Container Instances'
      tag:
        type: string
        required: false
        default: latest
        description: 'Prebuilt C-WCOW image tag (a YYYYMMDD tag during validation, or latest)'

jobs:
  info:
    if: ${{ !cancelled() }}
    name: info
    secrets: inherit
    uses: ./.github/workflows/workload-info-cwcow.yml
    with:
      id: info-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      tag: ${{ inputs.tag }}
      test_schedule: gh-daily

  info-vnet:
    if: ${{ !cancelled() }}
    name: info-vnet
    secrets: inherit
    needs: info
    uses: ./.github/workflows/workload-info-cwcow.yml
    strategy:
      fail-fast: false
      matrix:
        add_dummy_port: [true, false]
    with:
      id: info-cwcow-vnet${{ matrix.add_dummy_port && '-dummy-port' || '-no-port' }}
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      tag: ${{ inputs.tag }}
      use_vnet: true
      add_dummy_port: ${{ matrix.add_dummy_port }}
      continue_on_error: ${{ !matrix.add_dummy_port }}
      test_schedule: gh-daily

  minimal:
    if: ${{ !cancelled() }}
    name: minimal
    secrets: inherit
    needs: info-vnet
    uses: ./.github/workflows/workload-minimal-cwcow.yml
    with:
      id: minimal-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      workload: minimal_cwcow
      expected_output: hello c-wcow
      test_schedule: gh-daily

  minimal-servercore:
    if: ${{ !cancelled() }}
    name: minimal-servercore
    secrets: inherit
    needs: minimal
    uses: ./.github/workflows/workload-minimal-cwcow.yml
    with:
      id: minimal-cwcow-servercore
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      workload: minimal_cwcow_servercore
      expected_output: hello c-wcow servercore
      test_schedule: gh-daily

  long-lived:
    if: ${{ !cancelled() }}
    name: long-lived
    secrets: inherit
    needs: minimal-servercore
    uses: ./.github/workflows/workload-long-lived-cwcow.yml
    with:
      id: long-lived-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      test_schedule: gh-daily

  stress-tests:
    if: ${{ !cancelled() }}
    name: stress-tests
    secrets: inherit
    needs: long-lived
    uses: ./.github/workflows/workload-stress-tests-cwcow.yml
    with:
      id: stress-tests-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      test_schedule: gh-daily

  server:
    if: ${{ !cancelled() }}
    name: server
    secrets: inherit
    needs: stress-tests
    uses: ./.github/workflows/workload-server-cwcow.yml
    with:
      id: server-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      test_schedule: gh-daily

  managed-identity:
    if: ${{ !cancelled() }}
    name: managed-identity
    secrets: inherit
    needs: server
    uses: ./.github/workflows/workload-managed-identity-cwcow.yml
    strategy:
      fail-fast: false
      matrix:
        use_vnet: [true, false]
    with:
      id: managed-identity-cwcow${{ matrix.use_vnet && '-vnet' || '' }}
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: ${{ matrix.use_vnet }}
      test_schedule: gh-daily

  non-conf-ws2022:
    if: ${{ !cancelled() }}
    name: non-conf-ws2022
    secrets: inherit
    needs: managed-identity
    uses: ./.github/workflows/workload-non-confidential-wcow.yml
    strategy:
      fail-fast: false
      matrix:
        use_vnet: [true, false]
        use_managed_id: [true, false]
    with:
      id: non-conf-ws2022${{ matrix.use_vnet && '-vnet' || '' }}${{ matrix.use_managed_id && '-mi' || '' }}
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: ${{ matrix.use_vnet }}
      use_managed_id: ${{ matrix.use_managed_id }}
      tag: ${{ inputs.tag }}
      windows_version: ws2022
      test_schedule: gh-daily

  non-conf-ws2025:
    if: ${{ !cancelled() }}
    name: non-conf-ws2025
    secrets: inherit
    needs: non-conf-ws2022
    uses: ./.github/workflows/workload-non-confidential-wcow.yml
    strategy:
      fail-fast: false
      matrix:
        use_vnet: [true, false]
        use_managed_id: [true, false]
    with:
      id: non-conf-ws2025${{ matrix.use_vnet && '-vnet' || '' }}${{ matrix.use_managed_id && '-mi' || '' }}
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: ${{ matrix.use_vnet }}
      use_managed_id: ${{ matrix.use_managed_id }}
      tag: ${{ inputs.tag }}
      windows_version: ws2025
      continue_on_error: true
      test_schedule: gh-daily

  many-layers:
    if: ${{ !cancelled() }}
    name: many-layers
    secrets: inherit
    needs: non-conf-ws2025
    uses: ./.github/workflows/workload-many-layers-cwcow.yml
    with:
      id: many-layers-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      tag: ${{ inputs.tag }}
      test_schedule: gh-daily

  attestation:
    if: ${{ !cancelled() }}
    name: attestation
    secrets: inherit
    needs: many-layers
    uses: ./.github/workflows/workload-attestation-cwcow.yml
    with:
      id: attestation-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      tag: ${{ inputs.tag }}
      test_schedule: gh-daily

  skr-cwcow:
    if: ${{ !cancelled() }}
    name: skr-cwcow
    secrets: inherit
    needs: attestation
    uses: ./.github/workflows/workload-skr-cwcow.yml
    with:
      id: skr-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      test_schedule: gh-daily

  vnet:
    if: ${{ !cancelled() }}
    name: vnet
    secrets: inherit
    needs: skr-cwcow
    uses: ./.github/workflows/workload-vnet-cwcow.yml
    with:
      id: vnet-cwcow
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      test_schedule: gh-daily
