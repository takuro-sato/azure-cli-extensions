name: VN2 - Sweden Central

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-swedencentral.yml

jobs:
  vn2-swedencentral:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: swedencentral
      resource_group: vn2-aks-swedencentral
      aks_cluster_name: vn2-aks-swedencentral
