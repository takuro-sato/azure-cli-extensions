name: Perf - Italy North

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-italynorth.yml

jobs:
  perf-italynorth:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: italynorth
