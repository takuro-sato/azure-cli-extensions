name: Build and push test containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1
  REGISTRY: cacidashboardaci.azurecr.io
  REPOSITORY: prebuilt-test-containers

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.REGISTRY }}

      - name: Use short date as tag
        run: |
          TAG=$(date "+%Y%m%d")
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and push containers
        run: cd containers && make REGISTRY=$REGISTRY REPOSITORY=$REPOSITORY TAG=$TAG push

      - name: Tag with latest
        if: github.ref == 'refs/heads/main'
        run: |
          # Rebuilding the image won't change it due to caching
          cd containers && make REGISTRY=$REGISTRY REPOSITORY=$REPOSITORY TAG=latest push
