name: Build and push test containers

on:
  pull_request:
    paths:
      - .github/workflows/build-test-containers.yaml
      - containers/info_check.sh
      - containers/attestation_cwcow.Dockerfile
      - containers/maa_attest.py
      - containers/info_cwcow.Dockerfile
      - containers/info_wcow_ws2022.Dockerfile
      - containers/info_wcow.py
      - containers/many_layers_cwcow.Dockerfile
      - containers/attest.py
      - containers/psputil/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1
  REGISTRY: cacidashboardaci.azurecr.io
  REPOSITORY: prebuilt-test-containers

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.REGISTRY }}

      - name: Use short date as tag
        run: |
          TAG=$(date "+%Y%m%d")
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and push containers
        run: cd containers && make REGISTRY=$REGISTRY REPOSITORY=$REPOSITORY TAG=$TAG push

      - name: Tag with latest
        if: github.ref == 'refs/heads/main'
        run: |
          # Rebuilding the image won't change it due to caching
          cd containers && make REGISTRY=$REGISTRY REPOSITORY=$REPOSITORY TAG=latest push

  build-and-push-windows-ws2022:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Login to ACR
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Use short date as tag
        shell: pwsh
        run: |
          $tag = Get-Date -Format 'yyyyMMdd'
          Write-Host "TAG=$tag"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and push WS2022 info image
        shell: pwsh
        working-directory: containers
        env:
          DOCKER_BUILDKIT: 0
        run: |
          $image = "$env:REGISTRY/$env:REPOSITORY/info-wcow-ws2022"
          docker build -t "${image}:$env:TAG" -f info_wcow_ws2022.Dockerfile .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed" }
          docker push "${image}:$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "docker push failed" }

      - name: Tag with latest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: containers
        run: |
          $image = "$env:REGISTRY/$env:REPOSITORY/info-wcow-ws2022"
          docker tag "${image}:$env:TAG" "${image}:latest"
          docker push "${image}:latest"
          if ($LASTEXITCODE -ne 0) { throw "docker push (latest) failed" }

  # Confidential-WCOW images require Windows Server 2025 bases. psputilgo.exe
  # is a native Go build copied into the image because there is no ltsc2025 Go
  # builder image.
  build-and-push-windows-ws2025:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Login to ACR
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Use short date as tag
        shell: pwsh
        run: |
          $tag = Get-Date -Format 'yyyyMMdd'
          Write-Host "TAG=$tag"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build psputilgo.exe
        shell: pwsh
        working-directory: containers/psputil
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o psputilgo.exe .

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Pull amdsnppspapi.dll from ACR
        shell: pwsh
        working-directory: containers/psputil
        env:
          # x64 amdsnppspapi.dll, stored as an OCI artifact in the team ACR
          # (origin: internal rs_base2_hyp Windows build, 2025-08-30). Bundled
          # into the image next to psputilgo.exe so NewLazyDLL can load it from
          # the exe directory inside the confidential guest.
          DLL_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/amdsnppspapi-dll:20250830
        run: |
          oras pull "$env:DLL_REF"
          if ($LASTEXITCODE -ne 0) { throw "oras pull failed" }
          if (-not (Test-Path amdsnppspapi.dll)) { throw "amdsnppspapi.dll not present after pull" }
          Write-Host "Pulled amdsnppspapi.dll ($((Get-Item amdsnppspapi.dll).Length) bytes)"

      - name: Build and push C-WCOW images
        shell: pwsh
        working-directory: containers
        env:
          # Windows-container builds use the classic builder; BuildKit/buildx
          # is not available for Windows containers on the windows-2025 runner.
          DOCKER_BUILDKIT: 0
        run: |
          $infoImage = "$env:REGISTRY/$env:REPOSITORY/info-cwcow-ws2025"
          docker build -t "${infoImage}:$env:TAG" -f info_cwcow.Dockerfile .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed for info-cwcow-ws2025" }
          docker push "${infoImage}:$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "docker push failed for info-cwcow-ws2025" }

          # Preserve the existing confidential WCOW image reference as a
          # WS2025 alias.
          $infoAlias = "$env:REGISTRY/$env:REPOSITORY/info-cwcow"
          docker tag "${infoImage}:$env:TAG" "${infoAlias}:$env:TAG"
          docker push "${infoAlias}:$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "docker push failed for info-cwcow alias" }

          $attestationImage = "$env:REGISTRY/$env:REPOSITORY/attestation-cwcow"
          docker build -t "${attestationImage}:$env:TAG" -f attestation_cwcow.Dockerfile .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed" }
          docker push "${attestationImage}:$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "docker push (tag) failed" }

          $manyLayersImage = "$env:REGISTRY/$env:REPOSITORY/many-layers-cwcow"
          docker build -t "${manyLayersImage}:$env:TAG" -f many_layers_cwcow.Dockerfile .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed" }
          docker push "${manyLayersImage}:$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "docker push (tag) failed" }

      - name: Tag with latest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: containers
        run: |
          foreach ($name in @('info-cwcow', 'info-cwcow-ws2025', 'attestation-cwcow', 'many-layers-cwcow')) {
            $image = "$env:REGISTRY/$env:REPOSITORY/$name"
            docker tag "${image}:$env:TAG" "${image}:latest"
            docker push "${image}:latest"
            if ($LASTEXITCODE -ne 0) { throw "docker push (latest) failed" }
          }
