name: VN2 - Italy North

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '52 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-italynorth:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: italynorth
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-italynorth
