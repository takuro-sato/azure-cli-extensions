name: VN2 - Brazil Southeast

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '12 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-brazilsoutheast:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: brazilsoutheast
      resource_group: vn2-aks-brazilsoutheast
      aks_cluster_name: vn2-aks-brazilsoutheast
