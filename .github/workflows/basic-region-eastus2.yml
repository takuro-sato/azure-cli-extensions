name: Region (Basic) - East US 2

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-eastus2.yml
  schedule:
    - cron: '12 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-eastus2:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: eastus2
