name: VN2 - India South Central

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '34 18 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-indiasouthcentral.yml

jobs:
  vn2-indiasouthcentral:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: indiasouthcentral
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-indiasouthcentral
