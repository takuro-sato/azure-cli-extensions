name: Attestation - South India

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-southindia.yml
  schedule:
    - cron: '38 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-southindia:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: southindia
      policy_type: allow_all
      test_schedule: gh-hourly
