name: Region (Basic) - Norway West

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-norwaywest.yml
  schedule:
    - cron: '31 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-norwaywest:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: norwaywest
