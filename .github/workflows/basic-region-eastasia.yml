name: Region (Basic) - East Asia

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-eastasia.yml
  schedule:
    - cron: '12 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-eastasia:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: eastasia
