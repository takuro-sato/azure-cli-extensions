name: Region (Basic) - Central US EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/basic-region-centraluseuap.yml

jobs:
  basic-centraluseuap:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: centraluseuap
