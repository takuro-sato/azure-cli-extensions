name: Region (Basic) - Brazil Southeast

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-brazilsoutheast.yml
  schedule:
    - cron: '3 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-brazilsoutheast:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: brazilsoutheast
