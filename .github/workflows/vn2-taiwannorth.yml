name: VN2 - Taiwan North

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '2 20 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-taiwannorth:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: taiwannorth
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-taiwannorth
