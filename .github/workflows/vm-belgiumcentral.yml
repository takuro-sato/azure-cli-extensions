name: VM - Belgium Central

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '8 1 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vm-belgiumcentral:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: belgiumcentral
