name: Region (Basic) - West US 2

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-westus2.yml
  schedule:
    - cron: '39 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-westus2:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: westus2
