name: Region (Basic) - West US 3

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/basic-region-westus3.yml

jobs:
  basic-westus3:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: westus3
