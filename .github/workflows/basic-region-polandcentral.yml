name: Region (Basic) - Poland Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-polandcentral.yml
  schedule:
    - cron: '32 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-polandcentral:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: polandcentral
