name: Attestation - South East Asia

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-southeastasia.yml
  schedule:
    - cron: '37 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-southeastasia:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: southeastasia
      policy_type: allow_all
      test_schedule: gh-hourly
