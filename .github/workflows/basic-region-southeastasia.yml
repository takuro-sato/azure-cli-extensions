name: Region (Basic) - South East Asia

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-southeastasia.yml
  schedule:
    - cron: '36 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-southeastasia:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: southeastasia
