name: Attestation - East US 2 EUAP

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-eastus2euap.yml
  schedule:
    - cron: '18 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-eastus2euap:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: eastus2euap
      policy_type: allow_all
      test_schedule: gh-hourly
