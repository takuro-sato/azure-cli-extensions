name: VN2 - North Europe

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-northeurope.yml

jobs:
  vn2-northeurope:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: northeurope
      resource_group: vn2-aks-northeurope
      aks_cluster_name: vn2-aks-northeurope
