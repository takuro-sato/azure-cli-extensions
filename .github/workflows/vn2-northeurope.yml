name: VN2 - North Europe

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '23 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-northeurope:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: northeurope
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-northeurope
