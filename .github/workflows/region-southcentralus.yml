name: Region - South Central US

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '8 4 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  southcentralus:
    secrets: inherit
    uses: ./.github/workflows/region.yml
    with:
      location: southcentralus
