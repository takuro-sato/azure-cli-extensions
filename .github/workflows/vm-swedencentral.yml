name: VM - Sweden Central

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '57 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vm-swedencentral:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: swedencentral
