name: VM - Sweden Central

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '5 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vm-swedencentral.yml

jobs:
  vm-swedencentral:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: swedencentral
