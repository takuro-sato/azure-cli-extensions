name: VN2 - Australia East

permissions:
   id-token: write
   contents: read

on:
  pull_request:
    paths:
      - .github/workflows/vn2-australiaeast.yml
  schedule:
    - cron: '10 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-australiaeast:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: australiaeast
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-australiaeast
