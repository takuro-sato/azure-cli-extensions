name: VN2 - Australia East

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '12 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-australiaeast:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: australiaeast
      resource_group: vn2-aks-australiaeast
      aks_cluster_name: vn2-aks-australiaeast
