name: Attestation - Australia Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-australiacentral.yml
  schedule:
    - cron: '5 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-australiacentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: australiacentral
      policy_type: allow_all
      test_schedule: gh-hourly
