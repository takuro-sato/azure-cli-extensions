name: Attestation - South Central US

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '23 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-southcentralus:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: southcentralus
      policy_type: allow_all
