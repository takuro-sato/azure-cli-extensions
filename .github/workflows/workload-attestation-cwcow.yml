name: Workload - Attestation C-WCOW

# Confidential WCOW attestation workload.
#
# Deploys a custom Windows client with a colocated SKR sidecar. The client calls
# /attest/maa over localhost and prints the response; the workflow verifies that
# MAA reports an Azure-compliant UVM.
#
# C-WCOW constraints (same as the other *-cwcow workflows):
#   * Policy type is always 'allow_all' — generated WCOW policies need confcom
#     1.3.0+wcow and Windows Docker, unavailable on ubuntu-latest.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      tag:
        type: string
        description: Attestation client image tag
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      tag:
        type: string
        description: Attestation client image tag
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Attestation C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKLOAD: workloads/attestation_cwcow
  DEPLOYMENT_NAME: ${{ inputs.id || 'attestation-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  TAG: ${{ inputs.tag || 'latest' }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: 'maa'

jobs:
  attestation-cwcow:
    name: ${{ inputs.id || 'attestation-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Set Regional MAA Endpoint
        run: ./scripts/set_maa_endpoint.sh

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set $WORKLOAD --parameter cpu=$CPU
          c-aci-testing aci param_set $WORKLOAD --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set $WORKLOAD --parameter registry=$REGISTRY
          c-aci-testing aci param_set $WORKLOAD --parameter repository=$REPOSITORY
          c-aci-testing aci param_set $WORKLOAD --parameter tag=$TAG
          c-aci-testing aci param_set $WORKLOAD --parameter attestationEndpoint=$ATTESTATION_ENDPOINT

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen $WORKLOAD --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh $WORKLOAD

      - name: Get MAA Token
        run: |
          ./scripts/tracing/trace_step.py --start 'Get MAA Token'
          container_logs=''
          for _ in $(seq 1 20); do
            container_logs=$(az container logs \
              --resource-group "$RESOURCE_GROUP" \
              --name "$DEPLOYMENT_NAME" \
              --container-name primary 2>&1) || true
            if token=$(printf '%s' "$container_logs" | jq -er '.token | select(length > 0)' 2>/dev/null); then
              break
            fi
            sleep 15
          done
          if [ -z "${token:-}" ]; then
            echo "MAA token missing from primary container logs"
            printf '%s\n' "$container_logs"
            exit 1
          fi
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{
            padding = (4 - length($0) % 4) % 4;
            for (i = 0; i < padding; i++) $0 = $0 "=";
            print
          }' | base64 -d)
          compliance_status=$(printf '%s' "$payload" | jq -r '."x-ms-compliance-status"')
          if [ "$compliance_status" != 'azure-compliant-uvm' ]; then
            echo "Unexpected x-ms-compliance-status: $compliance_status"
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete --strict --output maa_compliance_status="$compliance_status"

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        if: always()
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
