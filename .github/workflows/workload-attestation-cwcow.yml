name: Workload - Attestation C-WCOW

# Confidential WCOW attestation workload.
#
# Deploys workloads/attestation_cwcow (the repo-prebuilt attestation-cwcow image,
# which embeds psputilgo.exe) as a confidential Windows ACI container group, then
# asserts the guest fetched a raw AMD SEV-SNP attestation report — the container
# emits `OUTPUT: {"snp_mode": true, "report_fetched": true, ...}` on success and
# `ERROR: ...` on failure, scraped by scripts/parse_container_output.py.
#
# Unlike the LCOW attestation workload (which uses an mcr.microsoft.com/aci/skr
# sidecar + MAA — no Windows equivalent exists), this mirrors the LCOW `info`
# model: an embedded tool fetches a RAW SNP report locally. See
# workloads/attestation_cwcow/attestation_cwcow.bicep for the rationale.
#
# C-WCOW constraints (same as the other *-cwcow workflows):
#   * No vnet — ACI Windows groups don't support subnet injection.
#   * Policy type is always 'allow_all' — generated WCOW policies need confcom
#     1.3.0+wcow and Windows Docker, unavailable on ubuntu-latest.
#   * Unlike the mcr-image cwcow workflows, REGISTRY/REPOSITORY/TAG are REAL
#     here: the image is pulled from our ACR (anonymous pull enabled), so they
#     are param_set onto the bicep.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      registry:
        type: string
        description: Container registry holding the attestation-cwcow image
        default: cacidashboardaci.azurecr.io
      repository:
        type: string
        description: Repository path within the registry
        default: prebuilt-test-containers
      tag:
        type: string
        description: Image tag (e.g. a YYYYMMDD tag during branch validation, or latest)
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      registry:
        type: string
        description: Container registry holding the attestation-cwcow image
        default: cacidashboardaci.azurecr.io
      repository:
        type: string
        description: Repository path within the registry
        default: prebuilt-test-containers
      tag:
        type: string
        description: Image tag (e.g. a YYYYMMDD tag during branch validation, or latest)
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Attestation C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKLOAD: workloads/attestation_cwcow
  DEPLOYMENT_NAME: ${{ inputs.id || 'attestation-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: ${{ inputs.registry || 'cacidashboardaci.azurecr.io' }}
  REPOSITORY: ${{ inputs.repository || 'prebuilt-test-containers' }}
  TAG: ${{ inputs.tag || 'latest' }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 4 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 8 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  attestation-cwcow:
    name: ${{ inputs.id || 'attestation-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set $WORKLOAD --parameter cpu=$CPU
          c-aci-testing aci param_set $WORKLOAD --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set $WORKLOAD --parameter registry=$REGISTRY
          c-aci-testing aci param_set $WORKLOAD --parameter repository=$REPOSITORY
          c-aci-testing aci param_set $WORKLOAD --parameter tag=$TAG

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen $WORKLOAD --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh $WORKLOAD

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          time=0
          # Confidential WCOW pods boot slower than LCOW; give psputilgo's report
          # fetch a wide window before we read its OUTPUT line.
          while [ $time -lt 20 ]; do
            sleep 15
            c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
            if grep -q 'OUTPUT: ' output.log; then
              break
            fi
            time=$((time + 1))
          done

      - name: Parse output
        if: always()
        run: |
          ./scripts/parse_container_output.py --must-have-output --fail-on-error output.log

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
