name: Attestation - Taiwan North

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-taiwannorth.yml
  schedule:
    - cron: '37 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-taiwannorth:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: taiwannorth
      policy_type: allow_all
      test_schedule: gh-hourly
