name: Region (Basic) C-WCOW

# Confidential WCOW equivalent of basic-region.yml. Smallest end-to-end smoke
# of confidential WCOW on a given region: deploy info_cwcow as a confidential
# ACI container group and assert the one-shot info dump completes.
#
# Non-VNet and VNet variants use the same info image and checks. Zonal C-WCOW
# coverage is not wired because info_cwcow does not yet declare a zone param.

permissions:
  id-token: write
  contents: read

# Reusable only -- WCOW container groups need a region whose ACISNP clusters
# carry the unified-l2bridge cplat (e.g. australiacentral2 today). Defaulting
# a path-triggered run to westeurope fails with UnsupportedWindowsVersion.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      location:
        type: string
        required: true
        description: 'The location of the Azure Container Instances'
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      location:
        type: string
        required: true
        description: 'The location of the Azure Container Instances'

jobs:
  info-cwcow-nonzoned-nonvnet:
    if: ${{ !cancelled() && !contains(vars.ACI_VNET_ONLY_REGIONS, format(',{0},', inputs.location)) && !contains(vars.ACI_ONLY_ZONAL_VNET_REGIONS, format(',{0},', inputs.location)) }}
    name: basic-info-cwcow-allow_all
    secrets: inherit
    uses: ./.github/workflows/workload-info-cwcow.yml
    with:
      id: basic-info-cwcow-allow_all
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: false
      test_schedule: gh-hourly

  info-cwcow-nonzoned-vnet:
    if: ${{ !cancelled() && !contains(vars.ACI_ONLY_ZONAL_VNET_REGIONS, format(',{0},', inputs.location)) }}
    name: basic-info-cwcow-vnet-allow_all
    secrets: inherit
    uses: ./.github/workflows/workload-info-cwcow.yml
    with:
      id: basic-info-cwcow-vnet-allow_all
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: true
      add_dummy_port: true
      test_schedule: gh-hourly
