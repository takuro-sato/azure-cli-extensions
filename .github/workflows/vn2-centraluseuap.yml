name: VN2 - Central US EUAP

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '7 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-centraluseuap:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: centraluseuap
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-centraluseuap
