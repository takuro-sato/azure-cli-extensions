name: Attestation - Brazil South

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-brazilsouth.yml
  schedule:
    - cron: '9 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-brazilsouth:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: brazilsouth
      policy_type: allow_all
      test_schedule: gh-hourly
