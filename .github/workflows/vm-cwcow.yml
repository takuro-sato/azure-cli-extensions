name: VM C-WCOW

# Standalone-VM confidential WCOW test workflow.
#
# Mirrors vm-simple.yml: provisions one Windows confidential VM with the
# cri-containerd-confidential cplat, then exercises each of the C-WCOW
# dashboard workloads on it via `c-aci-testing vm runc`. Sequential, one pod
# at a time: `vm runc`'s generated run.ps1 only tears down a pod of the *same*
# name before redeploying, so each workload would otherwise leave its pod
# resident as an idle "Ready" sandbox. On confidential WCOW every sandbox
# reserves a large fixed UVM memory allocation, and accumulating all five
# workloads exhausts the single DC8as_cc_v5 VM ("Not enough memory resources
# are available"). We therefore explicitly stop each pod (scripts/vm_stop_pod.sh)
# once we've asserted on its output, keeping at most one UVM resident at a time.
#
# Policy type is fixed to `allow_all`: `c-aci-testing policies gen` with
# --policy-type generated requires confcom 1.3.0+wcow installed on the host
# running the command, plus Windows Docker (per the c-aci-testing project
# README). Neither is available on ubuntu-latest. The `allow_all` path uses
# the static WCOW Rego template baked into c-aci-testing, no docker needed.
#
# IMPORTANT: CPLAT_BLOB_NAME must point to a blob containing a cri-containerd
# package with confidential WCOW support (runhcs-wcow-hypervisor runtime,
# confidential WCOW boot files). The default value of CPLAT_NEXT_6_1_BLOB_NAME
# may not satisfy this — override via workflow_dispatch if needed.

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/vm-cwcow.yml
      - 'workloads/*_cwcow/**'
      - 'workloads/*_cwcow_*/**'
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
      - scripts/vm_print_info.sh
      - scripts/vm_check_container_output.sh
      - scripts/vm_stop_pod.sh
      - scripts/vm_create_traced.sh
  push:
    paths:
      - .github/workflows/vm-cwcow.yml
      - 'workloads/*_cwcow/**'
      - 'workloads/*_cwcow_*/**'
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
      - scripts/vm_print_info.sh
      - scripts/vm_check_container_output.sh
      - scripts/vm_stop_pod.sh
      - scripts/vm_create_traced.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The zone to deploy to
        required: false
        default: ''
      vmImage:
        type: string
        description: The Atlas image to use for the VM (confidential WCOW capable)
        required: false
        default: ''
      vmSize:
        type: string
        description: The size of the VM
        default: Standard_DC8as_cc_v5
      cleanup:
        type: boolean
        description: Whether to cleanup the VM after testing
        default: true
      cplatBlobName:
        type: string
        description: Name of the containerplat blob (must include confidential WCOW support)
        default: ''
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The zone to deploy to
        required: false
        default: ''
      vmImage:
        type: string
        description: The Atlas image to use for the VM (confidential WCOW capable)
        required: false
        default: ''
      vmSize:
        type: string
        description: The size of the VM
        default: Standard_DC8as_cc_v5
      cleanup:
        type: boolean
        description: Whether to cleanup the VM after testing
        default: true
      cplatBlobName:
        type: string
        description: Name of the containerplat blob (must include confidential WCOW support)
        default: ''
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: vm
  TEST_NAME: VM C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'vm-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  STORAGE_ACCOUNT: cacitestingstorageaci
  # WCOW workloads pull from mcr.microsoft.com (image is pinned by digest in
  # bicep). REGISTRY is set only because c-aci-testing's argparse rejects a
  # missing --registry even for --policy-type allow_all; the value is never
  # actually used by the WCOW workloads.
  REGISTRY: cacidashboardaci.azurecr.io
  LOCATION: ${{ inputs.location || 'westeurope' }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  VM_SIZE: ${{ inputs.vmSize || 'Standard_DC8as_cc_v5' }}
  # Track the latest image in the NightlyOSImage gallery (lt_release_svc_prod1)
  # rather than pinning a version: confidential WCOW depends on bleeding-edge
  # hypervisor bits, and tracking 'latest' is deliberate so the suite surfaces
  # regressions introduced by a new Windows image (per PR review feedback). The
  # marketplace WindowsServer/2025-datacenter-g2/latest image is NOT a
  # substitute. The CI federated identity needs Reader on the NightlyOSImage
  # gallery in subscription 824db9f9-... (resource group cwcow-automation).
  VM_IMAGE: ${{ inputs.vmImage || '/subscriptions/824db9f9-0ff1-49f2-ab3e-4b72dfb9dd6a/resourceGroups/cwcow-automation/providers/Microsoft.Compute/galleries/NightlyOSImage/images/lt_release_svc_prod1/versions/latest' }}
  USE_OFFICIAL_IMAGES: ''
  CPLAT_BLOB_NAME: ${{ inputs.cplatBlobName || 'cri-containerd-confidential-0.0.1-unified-l2bridge.zip' }}
  WIN_FLAVOR: 'ws2025'
  VM_ZONE: ${{ inputs.zone || '' }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  vm-cwcow:
    name: ${{ inputs.id || 'vm-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Downgrade Azure CLI
        env:
          AZ_CLI_VERSION: "2.81.0"
        run: ./scripts/install-az-cli.sh

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Generate Security Policies
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policies'
          for wl in minimal_cwcow minimal_cwcow_servercore info_cwcow long_lived_cwcow stress_tests_cwcow; do
            c-aci-testing policies gen workloads/$wl --deployment-name $DEPLOYMENT_NAME --policy-type allow_all
          done

      - name: Deploy VM
        run: ./scripts/vm_create_traced.sh

      - name: Print info
        run: scripts/vm_print_info.sh

      # ---------- One-shot workloads: container runs, prints output, exits ----------

      - name: 'Workload - minimal_cwcow'
        env:
          STEP_PREFIX: 'minimal_cwcow'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing vm runc workloads/minimal_cwcow --deployment-name $DEPLOYMENT_NAME --prefix minimal_cwcow

      - name: 'Workload - minimal_cwcow check output'
        env:
          STEP_PREFIX: 'minimal_cwcow'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q 'hello c-wcow' container_output.log || { echo "missing 'hello c-wcow' in minimal_cwcow output"; exit 1; }

      - name: 'Workload - minimal_cwcow stop pod'
        env:
          STEP_PREFIX: 'minimal_cwcow'
        run: ./scripts/vm_stop_pod.sh

      - name: 'Workload - minimal_cwcow_servercore'
        env:
          STEP_PREFIX: 'minimal_cwcow_servercore'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing vm runc workloads/minimal_cwcow_servercore --deployment-name $DEPLOYMENT_NAME --prefix minimal_cwcow_servercore

      - name: 'Workload - minimal_cwcow_servercore check output'
        env:
          STEP_PREFIX: 'minimal_cwcow_servercore'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q 'hello c-wcow servercore' container_output.log || { echo "missing 'hello c-wcow servercore' in minimal_cwcow_servercore output"; exit 1; }

      - name: 'Workload - minimal_cwcow_servercore stop pod'
        env:
          STEP_PREFIX: 'minimal_cwcow_servercore'
        run: ./scripts/vm_stop_pod.sh

      - name: 'Workload - info_cwcow'
        env:
          STEP_PREFIX: 'info_cwcow'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing vm runc workloads/info_cwcow --deployment-name $DEPLOYMENT_NAME --prefix info_cwcow

      - name: 'Workload - info_cwcow check output'
        env:
          STEP_PREFIX: 'info_cwcow'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q '===HOSTNAME===' container_output.log || { echo "missing ===HOSTNAME=== marker"; exit 1; }
          grep -q '===EOF===' container_output.log || { echo "missing ===EOF=== marker (info dump did not complete)"; exit 1; }

      - name: 'Workload - info_cwcow stop pod'
        env:
          STEP_PREFIX: 'info_cwcow'
        run: ./scripts/vm_stop_pod.sh

      # ---------- Long-running workloads: harness check.ps1 (run inside vm runc) is the assertion ----------

      - name: 'Workload - long_lived_cwcow'
        env:
          STEP_PREFIX: 'long_lived_cwcow'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing vm runc workloads/long_lived_cwcow --deployment-name $DEPLOYMENT_NAME --prefix long_lived_cwcow

      - name: 'Workload - long_lived_cwcow stop pod'
        env:
          STEP_PREFIX: 'long_lived_cwcow'
        run: ./scripts/vm_stop_pod.sh

      - name: 'Workload - stress_tests_cwcow'
        env:
          STEP_PREFIX: 'stress_tests_cwcow'
        run: |
          ./scripts/tracing/trace_step.py --start 'vm runc'
          c-aci-testing vm runc workloads/stress_tests_cwcow --deployment-name $DEPLOYMENT_NAME --prefix stress_tests_cwcow

      - name: 'Workload - stress_tests_cwcow check output'
        env:
          STEP_PREFIX: 'stress_tests_cwcow'
        run: |
          ./scripts/vm_check_container_output.sh
          grep -q 'tick 1' container_output.log || { echo "missing 'tick 1' in stress_tests_cwcow output"; exit 1; }

      # ---------- Cleanup ----------

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Remove VM
        if: always()
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing vm remove --deployment-name $DEPLOYMENT_NAME
            # Don't leave VM hanging around even if deployment disappears
            az vm delete \
              --resource-group $RESOURCE_GROUP \
              --name ${DEPLOYMENT_NAME}-vm \
              --yes --force-deletion yes --verbose || true
          fi
