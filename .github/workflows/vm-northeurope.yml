name: VM - North Europe

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '53 22 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vm-northeurope:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: northeurope
