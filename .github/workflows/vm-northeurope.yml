name: VM - North Europe

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vm-northeurope.yml

jobs:
  vm-northeurope:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: northeurope
