name: VN2 - East US

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-eastus.yml

jobs:
  vn2-eastus:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: eastus
      resource_group: vn2-aks-eastus
      aks_cluster_name: vn2-aks-eastus
