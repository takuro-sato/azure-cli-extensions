name: Region - East US 2 EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/region-eastus2euap.yml

jobs:
  eastus2euap:
    secrets: inherit
    uses: ./.github/workflows/region.yml
    with:
      location: eastus2euap

  stress-tests-nocurl-allow-all:
    name: stress-tests-nocurl
    secrets: inherit
    uses: ./.github/workflows/workload-stress-tests-noserver.yml
    strategy:
      fail-fast: false
      matrix:
        script: ['workload_fio', 'workload_tar', 'workload_cpu', 'workload_exec', 'workload_cpu_fio', 'workload_multicpu_fio']
    with:
      id: stress-nocurl-aa-${{ matrix.script }}
      location: eastus2euap
      policy_type: allow_all
      script: ${{ matrix.script }}
      useNormalSidecar: true
      cpu: 2

  stress-tests-nocurl-debug:
    name: stress-tests-nocurl
    secrets: inherit
    uses: ./.github/workflows/workload-stress-tests-noserver.yml
    strategy:
      fail-fast: false
      matrix:
        script: ['workload_fio', 'workload_tar', 'workload_cpu', 'workload_exec', 'workload_cpu_fio', 'workload_multicpu_fio']
    with:
      id: stress-nocurl-dbg-${{ matrix.script }}
      location: eastus2euap
      policy_type: debug
      script: ${{ matrix.script }}
      useNormalSidecar: true
      cpu: 2

  vm-stress-tests:
    secrets: inherit
    uses: ./.github/workflows/vm-workload-stress-tests.yml
    strategy:
      fail-fast: false
      matrix:
        winFlavor: ['ws2022', 'ws2025']
    with:
      id: vm-stress-tests-${{ matrix.winFlavor }}-6.1
      location: eastus2euap
      cplatBlobName: ${{ vars.CPLAT_6_1_BLOB_NAME }}
      winFlavor: ${{ matrix.winFlavor }}
