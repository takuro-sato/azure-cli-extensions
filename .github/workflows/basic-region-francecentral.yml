name: Region (Basic) - France Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-francecentral.yml
  schedule:
    - cron: '14 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-francecentral:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: francecentral
