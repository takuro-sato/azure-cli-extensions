name: Workload - SKR C-WCOW

# Confidential WCOW equivalent of workload-skr.yml.
#
# The Linux skr workload runs a public-IP Python proxy in front of two
# localhost-only skr sidecars (HTTP + gRPC). This workload omits that proxy and
# gRPC layout and instead deploys a confidential Windows skr image
# (cacidashboardaci.azurecr.io/skr-windows) launched with
# `skr.exe -dangerouslySetListenAddr 0.0.0.0` so it serves the HTTP interface
# directly on the public IP (port 8000). There is no gRPC path.
#
# Like every other C-WCOW workload this uses a fixed allow_all policy
# (generated WCOW policies need confcom 1.3.0+wcow + Windows Docker, unavailable
# on ubuntu-latest — see workload-info-cwcow.yml). The policy is committed as
# workloads/skr_cwcow/policy_skr_cwcow.rego and loaded verbatim by the
# bicepparam, so its sha256 (the SEV-SNP host_data) is deterministic and the
# key-release tests can bind their release policy to it. We therefore never run
# `policies gen`.

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/skr_cwcow/**
      - workloads/skr/attestation.py
      - workloads/skr/key.py
      - .github/workflows/workload-skr-cwcow.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/skr_cwcow/**
      - workloads/skr/attestation.py
      - workloads/skr/key.py
      - .github/workflows/workload-skr-cwcow.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: SKR C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'skr-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  # allow_all does not bind to image layers, so 'latest' is safe and no pinning
  # is required (unlike skr-fixed-policy).
  TAG: latest
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: 'managed_identity,public_ip'

jobs:
  server:
    name: ${{ inputs.id || 'skr-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/skr_cwcow

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Test SKR
        run: |
          set +e -o pipefail
          ./scripts/tracing/trace_step.py --start 'Test SKR' || exit 1
          python -m unittest discover -s workloads/skr_cwcow 2>&1 | tee skr_test.log
          status=$?
          if [ $status -ne 0 ]; then
            maybe_err=(--err "SKR test failed")
          else
            maybe_err=()
          fi
          jq -Rs '{skrTestLog: .}' < skr_test.log | \
            ./scripts/tracing/trace_step.py --complete "${maybe_err[@]}" --output-from-stdin || exit 1
          exit $status

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        if: always()
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
