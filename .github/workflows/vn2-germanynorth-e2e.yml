name: 'VN2 - Germany North E2E'

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '26 18 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/vn2-germanynorth-e2e.yml

jobs:
  vn2-germanynorth-e2e:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: germanynorth
      environment: cacitesting.e2e.env
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-germanynorth
