name: Attestation - West US 2

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-westus2.yml
  schedule:
    - cron: '46 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-westus2:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: westus2
      policy_type: allow_all
      test_schedule: gh-hourly
