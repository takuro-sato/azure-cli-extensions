name: VN2 - North Central US

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '14 19 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-northcentralus.yml

jobs:
  vn2-northcentralus:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: northcentralus
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-northcentralus
