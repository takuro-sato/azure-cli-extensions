name: Attestation - Austria East

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-austriaeast.yml
  schedule:
    - cron: '7 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-austriaeast:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: austriaeast
      policy_type: allow_all
      test_schedule: gh-hourly
