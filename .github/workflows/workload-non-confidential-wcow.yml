name: Workload - Non Confidential WCOW

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/non_confidential_wcow/**
      - .github/workflows/workload-non-confidential-wcow.yml
      - containers/attest.py
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/non_confidential_wcow/**
      - .github/workflows/workload-non-confidential-wcow.yml
      - containers/attest.py
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The availability zone to deploy to
        default: ''
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      use_managed_id:
        type: boolean
        description: Whether to use a managed identity for the container group
        default: false
      tag:
        type: string
        description: Image tag
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The availability zone to deploy to
        default: ''
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      use_managed_id:
        type: boolean
        description: Whether to use a managed identity for the container group
        default: false
      tag:
        type: string
        description: Image tag
        default: latest
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci-non-confidential
  TEST_NAME: Non Confidential WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKLOAD: workloads/non_confidential_wcow
  DEPLOYMENT_NAME: ${{ inputs.id || 'non-confidential-wcow' }}-${{ inputs.location }}-${{ github.run_number }}
  REPOSITORY: prebuilt-test-containers
  TAG: ${{ inputs.tag || 'latest' }}
  MANAGED_IDENTITY: ${{ inputs.use_managed_id && format('cacidashboard-{0}', inputs.location || 'westeurope') || '' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  ZONE: ${{ inputs.zone }}
  USE_VNET: ${{ inputs.use_vnet || false }}
  USE_MANAGED_ID: ${{ inputs.use_managed_id || false }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: ${{ inputs.use_managed_id && 'managed_identity' || '' }}${{ inputs.use_managed_id && inputs.use_vnet && ',' || '' }}${{ inputs.use_vnet && 'vnet' || '' }}

jobs:
  non-confidential-wcow:
    name: ${{ inputs.id || 'non-confidential-wcow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set $WORKLOAD --parameter "zone='$ZONE'"
          c-aci-testing aci param_set $WORKLOAD --parameter useVnet=$USE_VNET
          c-aci-testing aci param_set $WORKLOAD --parameter cpu=$CPU
          c-aci-testing aci param_set $WORKLOAD --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set $WORKLOAD --parameter registry=$REGISTRY
          c-aci-testing aci param_set $WORKLOAD --parameter tag=$TAG

      - name: Deploy Container Group
        run: ./scripts/aci_deploy_traced.sh $WORKLOAD

      - name: Report result
        if: always()
        run: ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          time=0
          while [ $time -lt 20 ]; do
            sleep 15
            c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
            if grep -q 'OUTPUT: ' output.log; then
              break
            fi
            time=$((time + 1))
          done
          jq -Rs '{info_cwcow: .}' output.log | ./scripts/tracing/trace_step.py --complete --strict --output-from-stdin

      - name: Check log contains expected markers
        run: |
          ./scripts/tracing/trace_step.py --start 'Check non-confidential WCOW log'
          ok=1
          grep -q '===HOSTNAME===' output.log || ok=0
          grep -q '===EOF===' output.log || ok=0
          if [ $ok -ne 1 ]; then
            ./scripts/tracing/trace_step.py --complete --err 'log missing ===HOSTNAME=== or ===EOF==='
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete --strict

      - name: Parse output
        run: |
          ./scripts/parse_container_output.py --must-have-output --fail-on-error --error-count-threshold 2 --write-output-to parsed-output.json output.log
          jq -e '
            .snp_mode == false and
            .report_fetched == false and
            .security_context_schema_skipped == true and
            .error_count == 1 and
            .managed_identity_tested == $expect_identity and
            (($expect_identity | not) or .managed_identity_success == true)
          ' --argjson expect_identity "$USE_MANAGED_ID" parsed-output.json

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
