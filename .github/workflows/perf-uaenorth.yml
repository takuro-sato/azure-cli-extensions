name: Perf - UAE North

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-uaenorth.yml

jobs:
  perf-uaenorth:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: uaenorth
