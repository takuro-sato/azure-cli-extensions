name: Attestation - France South

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-francesouth.yml
  schedule:
    - cron: '20 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-francesouth:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: francesouth
      policy_type: allow_all
      test_schedule: gh-hourly
