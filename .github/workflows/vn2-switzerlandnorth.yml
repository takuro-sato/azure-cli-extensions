name: VN2 - Switzerland North

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '58 19 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-switzerlandnorth:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: switzerlandnorth
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-switzerlandnorth
