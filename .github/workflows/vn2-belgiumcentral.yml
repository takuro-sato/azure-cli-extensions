name: VN2 - Belgium Central

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '38 17 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-belgiumcentral.yml

jobs:
  vn2-belgiumcentral:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: belgiumcentral
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-belgiumcentral
