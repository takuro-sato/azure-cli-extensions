name: Region (Basic) - Central US

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-centralus.yml
  schedule:
    - cron: '8 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-centralus:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: centralus
