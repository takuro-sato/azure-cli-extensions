name: Uptime - Australia Central 2

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '51 20 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  uptime:
    secrets: inherit
    uses: ./.github/workflows/uptime.yml
    with:
      location: australiacentral2
