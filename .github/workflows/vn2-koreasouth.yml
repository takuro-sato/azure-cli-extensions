name: VN2 - Korea South

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '24 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-koreasouth.yml

jobs:
  vn2-koreasouth:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: koreasouth
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-koreasouth
