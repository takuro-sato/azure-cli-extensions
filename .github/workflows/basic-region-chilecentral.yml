name: Region (Basic) - Chile Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-chilecentral.yml
  schedule:
    - cron: '9 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-chilecentral:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: chilecentral
