name: Region (Basic) - Australia Central 2

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-australiacentral2.yml
  schedule:
    - cron: '1 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-australiacentral2:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: australiacentral2
      # The 4 newly-provisioned ACISNP clusters in CBR2 run a test-signed unified
      # cplat package (ContainerPlat-Test-AMD-UVM-DoNotTrust), so the info workload
      # validates the Test UVM DID (expect_uvm_signature: Test) until they are
      # cycled onto the prod-signed cplat.
      # require_host_amd_cert is disabled separately: the host AMD cert is currently
      # missing due to a known bug (not because this is a test cplat) that still
      # needs a fix; re-enable this check once that lands.
      require_host_amd_cert: false
      expect_uvm_signature: Test
