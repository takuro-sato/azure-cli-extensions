name: Region (Basic) - Japan East

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-japaneast.yml
  schedule:
    - cron: '20 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-japaneast:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: japaneast
