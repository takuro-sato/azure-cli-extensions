name: Workload - Non Confidential

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/non_confidential/**
      - .github/workflows/workload-non-confidential.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/non_confidential/**
      - .github/workflows/workload-non-confidential.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The availability zone to deploy to
        default: ''
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The availability zone to deploy to
        default: ''
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci-non-confidential
  TEST_NAME: Non Confidential
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'non-confidential' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboardaci.azurecr.io
  REPOSITORY: prebuilt-test-containers
  TAG: latest
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  ZONE: ${{ inputs.zone }}
  USE_VNET: ${{ inputs.use_vnet || false }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: ${{ inputs.use_vnet && 'vnet' || '' }}

jobs:
  non-confidential:
    name: ${{ inputs.id || 'non-confidential' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Pull Image
        run: c-aci-testing images pull workloads/non_confidential

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/non_confidential --parameter "zone='$ZONE'"
          c-aci-testing aci param_set workloads/non_confidential --parameter useVnet=$USE_VNET
          c-aci-testing aci param_set workloads/non_confidential --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/non_confidential --parameter memoryInGb=$MEMORY_IN_GB

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/non_confidential

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          sleep 120
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
          cat output.log | jq -R -s '{info: .}' | ./scripts/tracing/trace_step.py --complete --strict --output-from-stdin

      - name: Parse output
        run: |
          # sev-guest / security-context validation is expected to fail on a
          # non-confidential container group, so allow those errors through.
          ./scripts/parse_container_output.py --fail-on-error --error-count-threshold 10 output.log

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
