name: Attestation - Central India

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '9 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-centralindia:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: centralindia
      policy_type: allow_all
      test_schedule: gh-hourly
