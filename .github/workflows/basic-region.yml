name: Region (Basic)

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region.yml
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      location:
        type: string
        required: true
        description: 'The location of the Azure Container Instances'
      require_host_amd_cert:
        type: boolean
        description: Whether the info workload should fail if /security-context-*/host-amd-cert-base64 is missing
        default: true
      expect_uvm_signature:
        type: string
        description: Which UVM endorsement DID to validate against ('Prod' or 'Test')
        default: Prod
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      location:
        type: string
        required: true
        description: 'The location of the Azure Container Instances'
      require_host_amd_cert:
        type: boolean
        description: Whether the info workload should fail if /security-context-*/host-amd-cert-base64 is missing
        default: true
      expect_uvm_signature:
        type: string
        description: Which UVM endorsement DID to validate against ('Prod' or 'Test')
        default: Prod

jobs:
  info-nonzoned-nonvnet:
    if: ${{ !cancelled() && !contains(vars.ACI_VNET_ONLY_REGIONS, format(',{0},', inputs.location)) && !contains(vars.ACI_ONLY_ZONAL_VNET_REGIONS, format(',{0},', inputs.location)) }}
    name: info-nonzoned-nonvnet
    secrets: inherit
    uses: ./.github/workflows/workload-info.yml
    with:
      id: info-allow_all
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: false
      policy_type: allow_all
      test_schedule: gh-hourly
      require_host_amd_cert: ${{ inputs.require_host_amd_cert != false }}
      expect_uvm_signature: ${{ inputs.expect_uvm_signature || 'Prod' }}

  info-nonzoned-vnet:
    if: ${{ !cancelled() && !contains(vars.ACI_ONLY_ZONAL_VNET_REGIONS, format(',{0},', inputs.location)) }}
    name: info-nonzoned-vnet
    secrets: inherit
    uses: ./.github/workflows/workload-info.yml
    with:
      id: info-vnet-allow_all
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: true
      policy_type: allow_all
      test_schedule: gh-hourly
      require_host_amd_cert: ${{ inputs.require_host_amd_cert != false }}
      expect_uvm_signature: ${{ inputs.expect_uvm_signature || 'Prod' }}

  info-zoned-1-2:
    if: ${{ !cancelled() && contains(vars.ACI_ZONE_1_2_REGIONS, format(',{0},', inputs.location)) }}
    name: info-zoned
    secrets: inherit
    uses: ./.github/workflows/workload-info.yml
    strategy:
      fail-fast: false
      matrix:
        # only vnets are supported for zonal deployments
        use_vnet: [true]
        zone: ["1", "2"]
    with:
      id: info-zone${{ matrix.zone }}-${{ matrix.use_vnet && 'vnet-' || '' }}allow_all
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: ${{ matrix.use_vnet }}
      zone: ${{ matrix.zone }}
      policy_type: allow_all
      test_schedule: gh-hourly
      require_host_amd_cert: ${{ inputs.require_host_amd_cert != false }}
      expect_uvm_signature: ${{ inputs.expect_uvm_signature || 'Prod' }}

  info-zoned:
    if: ${{ !cancelled() && contains(vars.ACI_ZONED_REGIONS, format(',{0},', inputs.location)) }}
    name: info-zoned
    secrets: inherit
    uses: ./.github/workflows/workload-info.yml
    strategy:
      fail-fast: false
      matrix:
        # only vnets are supported for zonal deployments
        use_vnet: [true]
        zone: ["1", "2", "3"]
    with:
      id: info-zone${{ matrix.zone }}-${{ matrix.use_vnet && 'vnet-' || '' }}allow_all
      environment: ${{ inputs.environment || 'cacitesting.env' }}
      location: ${{ inputs.location }}
      use_vnet: ${{ matrix.use_vnet }}
      zone: ${{ matrix.zone }}
      policy_type: allow_all
      test_schedule: gh-hourly
      require_host_amd_cert: ${{ inputs.require_host_amd_cert != false }}
      expect_uvm_signature: ${{ inputs.expect_uvm_signature || 'Prod' }}
