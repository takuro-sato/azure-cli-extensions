name: Workload - Vnet C-WCOW

# Confidential WCOW equivalent of workload-vnet.yml.
#
# Deploys vnet_cwcow as a confidential Windows container group injected into a
# self-provisioned, ACI-delegated subnet (no public IP) on the target region's
# ACISNP fleet, and asserts the container reports an injected subnet IP
# (10.0.0.x) from inside the guest.
#
# Same C-WCOW constraints as the other workload-*-cwcow.yml:
#   * No registry/repository/tag plumbing — image is a digest-pinned
#     mcr.microsoft.com/windows/servercore image, pulled by the host at deploy
#     time. No image pull step (no ACR involved).
#   * Policy type is always 'allow_all' — generated WCOW policies need confcom
#     1.3.0+wcow and Windows Docker, unavailable on ubuntu-latest (see
#     vm-cwcow.yml). REGISTRY is a dummy to satisfy c-aci-testing's argparse.
#   * Confidential Windows subnet injection only works on a fleet whose unified
#     cplat was installed with -NetworkType byovnet (e.g. australiacentral2), so
#     this is reusable-only (no path-triggered default to westeurope).

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Vnet C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'vnet-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  # WCOW workloads pull from mcr.microsoft.com (image is digest-pinned in
  # bicep). REGISTRY is set only because c-aci-testing's argparse rejects a
  # missing --registry even for --policy-type allow_all; the value is never
  # actually used by the WCOW workloads.
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}

jobs:
  vnet-cwcow:
    name: ${{ inputs.id || 'vnet-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/vnet_cwcow --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/vnet_cwcow --parameter memoryInGb=$MEMORY_IN_GB

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/vnet_cwcow --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/vnet_cwcow

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          sleep 120
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
          cat output.log | jq -R -s '{vnet_cwcow: .}' | ./scripts/tracing/trace_step.py --complete --strict --output-from-stdin

      - name: 'Check log reports an injected subnet IP'
        run: |
          ./scripts/tracing/trace_step.py --start 'Check vnet_cwcow log'
          if ! grep -qE 'VNET_CWCOW_SUBNET_IP=10\.0\.0\.' output.log; then
            ./scripts/tracing/trace_step.py --complete --err 'vnet_cwcow log missing injected subnet IP (VNET_CWCOW_SUBNET_IP=10.0.0.x)'
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete --strict

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group and vnet
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
            az network vnet delete --name ${DEPLOYMENT_NAME}-vnet --resource-group $RESOURCE_GROUP || true
            az network nsg delete --name ${DEPLOYMENT_NAME}-nsg --resource-group $RESOURCE_GROUP || true
          fi
