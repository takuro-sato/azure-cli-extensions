name: Attestation - Brazil Southeast

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-brazilsoutheast.yml
  schedule:
    - cron: '8 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-brazilsoutheast:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: brazilsoutheast
      policy_type: allow_all
      test_schedule: gh-hourly
