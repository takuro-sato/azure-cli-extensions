name: Attestation - Brazil Southeast

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '28 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-brazilsoutheast:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: brazilsoutheast
      policy_type: allow_all
