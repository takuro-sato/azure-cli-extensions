name: VN2 - Japan East

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-japaneast.yml

jobs:
  vn2-japaneast:
    secrets: inherit
    uses: ./.github/workflows/vn2-helloworld.yml
    with:
      location: japaneast
      resource_group: vn2-aks-japaneast
      aks_cluster_name: vn2-aks-japaneast
