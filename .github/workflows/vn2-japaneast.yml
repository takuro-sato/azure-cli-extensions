name: VN2 - Japan East

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '11 8 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-japaneast:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: japaneast
      resource_group: vn2-aks-japaneast
      aks_cluster_name: vn2-aks-japaneast
