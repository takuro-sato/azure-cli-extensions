name: Attestation - West US 3

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-westus3.yml
  schedule:
    - cron: '44 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-westus3:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: westus3
      policy_type: allow_all
      test_schedule: gh-hourly
