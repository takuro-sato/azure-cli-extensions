name: Attestation - Australia East

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-australiaeast.yml
  schedule:
    - cron: '6 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-australiaeast:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: australiaeast
      policy_type: allow_all
      test_schedule: gh-hourly
