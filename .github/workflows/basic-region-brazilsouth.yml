name: Region (Basic) - Brazil South

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-brazilsouth.yml
  schedule:
    - cron: '2 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-brazilsouth:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: brazilsouth
