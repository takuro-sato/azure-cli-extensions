name: Region (Basic) - Korea South

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-koreasouth.yml
  schedule:
    - cron: '23 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-koreasouth:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: koreasouth
