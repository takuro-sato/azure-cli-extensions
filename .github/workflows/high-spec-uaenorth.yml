name: High Spec - UAE North

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/high-spec-uaenorth.yml

jobs:
  high-spec-uaenorth:
    uses: ./.github/workflows/high-spec.yml
    secrets: inherit
    with:
      location: uaenorth
