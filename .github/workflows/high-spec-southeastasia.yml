name: High Spec - South East Asia

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '45 6 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/high-spec-southeastasia.yml
      - .github/workflows/high-spec.yml

jobs:
  high-spec-southeastasia:
    uses: ./.github/workflows/high-spec.yml
    secrets: inherit
    with:
      location: southeastasia
