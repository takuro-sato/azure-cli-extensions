name: VM - Southeast Asia

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '5 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vm-southeastasia.yml

jobs:
  vm-southeastasia:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: southeastasia
