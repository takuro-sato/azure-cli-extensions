name: VM - Southeast Asia

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vm-southeastasia.yml

jobs:
  vm-southeastasia:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: southeastasia
