name: Attestation - North Europe

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '20 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-northeurope:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: northeurope
      policy_type: allow_all
