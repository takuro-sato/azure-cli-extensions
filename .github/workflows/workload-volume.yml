name: Workload - Volume

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/volume/**
      - .github/workflows/workload-volume.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/volume/**
      - .github/workflows/workload-volume.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Volume
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'volume' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: mcr.microsoft.com
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}
  STORAGE_ACCOUNT: cacidashboardvolumetest
  RUN_FEATURES: azureFile

jobs:
  volume:
    name: ${{ inputs.id || 'volume' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Pull Image
        run: c-aci-testing images pull workloads/volume

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/volume --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/volume --parameter memoryInGb=$MEMORY_IN_GB
          c-aci-testing aci param_set workloads/volume --parameter shareName=share
          c-aci-testing aci param_set workloads/volume --parameter storageAccountName=$STORAGE_ACCOUNT
          storage_key=$(az storage account keys list \
            --resource-group $RESOURCE_GROUP \
            --account-name $STORAGE_ACCOUNT \
            --query "[0].value" -o tsv)
          c-aci-testing aci param_set workloads/volume --parameter key=$storage_key > /dev/null

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/volume --deployment-name $DEPLOYMENT_NAME
          cat workloads/volume/policy_volume.rego

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/volume

      - name: Verify File Creation
        run: |
          sleep 20 # Wait in case it takes a while for the file to be created

          ./scripts/tracing/trace_step.py --start 'Verify File Creation'
          container_logs=$(az container logs \
            --resource-group $RESOURCE_GROUP \
            --name $DEPLOYMENT_NAME \
            --container-name primary)

          echo "Container output:"
          echo "$container_logs"

          filename=$(echo "$container_logs" | grep "File name: " | sed 's/File name: //')
          if [ -z "$filename" ]; then
            echo "File name not found in container logs"
            exit 1
          else
            echo "Found file name: $filename"
            echo "filename=$filename" >> $GITHUB_ENV
          fi

          # Verify file exists in storage
          echo "Verifying file exists in storage account..."
          file_exists=$(az storage file exists \
            --account-name $STORAGE_ACCOUNT \
            --share-name share \
            --path "$filename" \
            --auth-mode key \
            --account-key ${{ secrets.TINGMAO_STORAGE_KEY }} \
            --query "exists" -o tsv)

          if [ "$file_exists" = "true" ]; then
            echo "File $filename exists in storage account"
          else
            echo "File $filename does not exist in storage account"
            exit 1
          fi

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Clean up file from storage
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ "$filename" != "" ]]; then
            echo "Deleting file $filename from storage account..."
            az storage file delete \
              --account-name $STORAGE_ACCOUNT \
              --share-name share \
              --path "$filename" \
              --yes
          else
            echo "No file to delete"
          fi

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
