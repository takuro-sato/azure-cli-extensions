name: Workload - Server C-WCOW

# Confidential WCOW equivalent of workload-server.yml.
#
# Deploys a single confidential WCOW container group running the Windows Server
# Core IIS image (server_cwcow) on the target region's ACISNP fleet, exposes it
# on a public IP, and asserts the IIS default page is reachable over HTTP :80.
#
# Same C-WCOW constraints as the other *-cwcow workflows:
#   * No registry/repository/tag plumbing — image is a digest-pinned
#     mcr.microsoft.com/windows/servercore/iis image, pulled by the host at
#     deploy time.
#   * No image pull step (no ACR involved).
#   * Policy type is always 'allow_all' — generated WCOW policies need confcom
#     1.3.0+wcow and Windows Docker, unavailable on ubuntu-latest (see
#     vm-cwcow.yml). REGISTRY is a dummy to satisfy c-aci-testing's argparse.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Server C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKLOAD: workloads/server_cwcow
  DEPLOYMENT_NAME: ${{ inputs.id || 'server-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  # WCOW workloads pull from mcr.microsoft.com (image is digest-pinned in
  # bicep). REGISTRY is set only because c-aci-testing's argparse rejects a
  # missing --registry even for --policy-type allow_all; the value is never
  # actually used by the WCOW workloads.
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CPU: ${{ inputs.cpu || 4 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 8 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: 'public_ip'

jobs:
  server-cwcow:
    name: ${{ inputs.id || 'server-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set $WORKLOAD --parameter cpu=$CPU
          c-aci-testing aci param_set $WORKLOAD --parameter memoryInGb=$MEMORY_IN_GB

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen $WORKLOAD --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh $WORKLOAD

      - name: Wait for IP address
        run: |
          ./scripts/aci_get_ip.sh

      - name: Curl Server
        run: |
          ./scripts/curl_check_with_retry.sh "http://$ip_address:80"

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      # See container output even if curl check from our end fails
      - name: Monitor Container Group
        if: always()
        run: |
          set -eo pipefail
          sleep 210 # waits for anything inside the container to finish
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
          jq -Rs '{containerLog: .}' output.log | ./scripts/tracing/trace_step.py \
            --complete --strict --output-from-stdin

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
