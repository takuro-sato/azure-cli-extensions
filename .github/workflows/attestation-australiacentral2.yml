name: Attestation - Australia Central 2

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '5 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-australiacentral2:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: australiacentral2
      policy_type: allow_all
      test_schedule: gh-hourly
