name: Region (Basic) - Australia Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-australiacentral.yml
  schedule:
    - cron: '0 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-australiacentral:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: australiacentral
