name: VN2 - UAE North

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-uaenorth.yml

jobs:
  vn2-uaenorth:
    secrets: inherit
    uses: ./.github/workflows/vn2-helloworld.yml
    with:
      location: uaenorth
      resource_group: vn2-aks-uaenorth
      aks_cluster_name: vn2-aks-uaenorth
