name: Attestation - Central US

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-centralus.yml
  schedule:
    - cron: '12 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-centralus:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: centralus
      policy_type: allow_all
      test_schedule: gh-hourly
