name: VN2 - Korea Central

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '58 18 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-koreacentral.yml

jobs:
  vn2-koreacentral:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: koreacentral
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-koreacentral
