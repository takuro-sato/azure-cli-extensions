name: Region (Basic) - Italy North

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-italynorth.yml
  schedule:
    - cron: '15 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-italynorth:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: italynorth
