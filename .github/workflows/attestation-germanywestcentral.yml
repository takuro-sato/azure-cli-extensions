name: Attestation - Germany West Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-germanywestcentral.yml
  schedule:
    - cron: '21 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-germanywestcentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: germanywestcentral
      policy_type: allow_all
      test_schedule: gh-hourly
