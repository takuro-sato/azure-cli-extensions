name: Attestation - France Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-francecentral.yml
  schedule:
    - cron: '18 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-francecentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: francecentral
      policy_type: allow_all
      test_schedule: gh-hourly
