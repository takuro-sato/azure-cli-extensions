name: Perf - South East Asia

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-southeastasia.yml

jobs:
  perf-southeastasia:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: southeastasia
