name: Workload - Managed Identity C-WCOW

# Confidential WCOW equivalent of workload-managed-identity.yml.
#
# Deploys a single confidential WCOW container group (managed_identity_cwcow)
# with a user-assigned managed identity and asserts the container could fetch an
# OAuth2 token from ACI's injected identity endpoint (it emits
# `OUTPUT: {"attempts": N, "success": true}`).
#
# Same C-WCOW constraints as the other *-cwcow workflows:
#   * No registry/repository/tag plumbing — image is a digest-pinned
#     mcr.microsoft.com/windows/servercore image, pulled by the host at deploy
#     time.
#   * No image pull step (no ACR involved).
#   * Optional shared vnet injection through aci-long-lived-vnet-<location>.
#     ACI injects IDENTITY_ENDPOINT and IDENTITY_HEADER into the Windows
#     container for managed identity token requests.
#   * Policy type is always 'allow_all' — generated WCOW policies need confcom
#     1.3.0+wcow and Windows Docker, unavailable on ubuntu-latest (see
#     vm-cwcow.yml). REGISTRY is a dummy to satisfy c-aci-testing's argparse.
#
# The managed identity itself ($MANAGED_IDENTITY -> bicep managedIDName) is
# wired automatically by c-aci-testing's aci_deploy, which param_sets it onto
# the bicepparam's existing managedIDName line.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      use_vnet:
        type: boolean
        description: Whether to use a virtual network for the container group
        default: false
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 4
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 8
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Managed Identity C-WCOW
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKLOAD: workloads/managed_identity_cwcow
  DEPLOYMENT_NAME: ${{ inputs.id || 'managed-identity-cwcow' }}-${{ inputs.location }}-${{ github.run_number }}
  # WCOW workloads pull from mcr.microsoft.com (image is digest-pinned in
  # bicep). REGISTRY is set only because c-aci-testing's argparse rejects a
  # missing --registry even for --policy-type allow_all; the value is never
  # actually used by the WCOW workloads.
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  USE_VNET: ${{ inputs.use_vnet || false }}
  CPU: ${{ inputs.cpu || 4 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 8 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: 'allow_all'
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: managed_identity${{ inputs.use_vnet && ',vnet' || '' }}

jobs:
  managed-identity-cwcow:
    name: ${{ inputs.id || 'managed-identity-cwcow' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}"

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set $WORKLOAD --parameter useVnet=$USE_VNET
          c-aci-testing aci param_set $WORKLOAD --parameter cpu=$CPU
          c-aci-testing aci param_set $WORKLOAD --parameter memoryInGb=$MEMORY_IN_GB

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen $WORKLOAD --deployment-name $DEPLOYMENT_NAME --policy-type allow_all

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh $WORKLOAD

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          time=0
          # Confidential WCOW pods boot slower than LCOW, so give the IMDS
          # probe a wider window to finish before we read its OUTPUT line.
          while [ $time -lt 20 ]; do
            sleep 15 # waits for curl test to finish
            c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log
            if grep -q 'OUTPUT: ' output.log; then
              break
            fi
            time=$((time + 1))
          done

      - name: Parse output
        if: always()
        run: |
          ./scripts/parse_container_output.py --must-have-output --fail-on-error output.log

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
