name: VN2 - South Africa West

permissions:
   id-token: write
   contents: read

on:
  pull_request:
    paths:
      - .github/workflows/vn2-southafricawest.yml
  schedule:
    - cron: '34 19 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-southafricawest:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: southafricawest
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-southafricawest
