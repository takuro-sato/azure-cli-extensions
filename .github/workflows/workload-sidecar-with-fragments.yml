name: Workload - Sidecar with fragments

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/workload-sidecar-with-fragments
      - .github/workflows/workload-sidecar-with-fragments.yml
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/workload-sidecar-with-fragments
      - .github/workflows/workload-sidecar-with-fragments.yml
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated

env:
  DEPLOYMENT_NAME: ${{ inputs.id || 'sidecar-fragment' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboard.azurecr.io
  MANAGED_IDENTITY: cacidashboard
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}

jobs:
  workload-sidecar-with-fragments:
    name: ${{ inputs.id || 'workload-sidecar-with-fragments' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Install c_aci_testing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-c-aci-testing.sh

      - name: Set Confcom Version
        run: |
          # az extension add -n confcom --version 1.1.2 --upgrade
          WHEEL_NAME=confcom-1.1.2a6-py3-none-any.whl
          echo Using temporary patched confcom extension $WHEEL_NAME
          az storage blob download --auth-mode login --container-name container --name $WHEEL_NAME --file $WHEEL_NAME --account-name cacitestingstorage
          az extension add --source ./$WHEEL_NAME --allow-preview true --yes

      - name: Install sign1util
        run: |
          mkdir -p /tmp/cosesign1go
          cd /tmp/cosesign1go
          curl -sL https://github.com/microsoft/cosesign1go/releases/download/v1.4.0/sign1util -o sign1util
          chmod +x sign1util
          echo "PATH=$PATH:/tmp/cosesign1go" >> $GITHUB_ENV

      - name: Setup Docker
        run: sudo usermod -aG docker $USER

      - name: Use precise current time as tag
        run: |
          export TAG=$(date "+%Y%m%d-%H%M%S.%N")
          echo TAG: $TAG
          . workloads/workload-sidecar-with-fragments/setup_vars.sh

          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "SIDECAR_REPO_A=$SIDECAR_REPO_A" >> $GITHUB_ENV
          echo "SIDECAR_REPO_B=$SIDECAR_REPO_B" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "SIDECAR_TAG=$SIDECAR_TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "SIDECAR_IMAGE_A=$SIDECAR_IMAGE_A" >> $GITHUB_ENV
          echo "SIDECAR_IMAGE_B=$SIDECAR_IMAGE_B" >> $GITHUB_ENV
          echo "FEED=$FEED" >> $GITHUB_ENV

      - name: Build, push and deploy
        run: |
          cd workloads/workload-sidecar-with-fragments
          make deploy

      - name: Show fragments and policies
        if: always()
        run: |
          cd workloads/workload-sidecar-with-fragments
          make show

      - name: Verify deployment
        if: always()
        run: |
          cd workloads/workload-sidecar-with-fragments
          make verify

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          for depl in ${DEPLOYMENT_NAME}-a ${DEPLOYMENT_NAME}-b ${DEPLOYMENT_NAME}-justsc; do
            az container show \
              --resource-group $RESOURCE_GROUP \
              --name $depl \
            | jq -c '.containers[]' | while read -r container; do
              container_name=$(echo "$container" | jq -r '.name')
              echo "Events for container $container_name:"
              echo "$container" | jq -r '.instanceView | .events[]'
            done
          done

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            for depl in ${DEPLOYMENT_NAME}-a ${DEPLOYMENT_NAME}-b ${DEPLOYMENT_NAME}-justsc; do
              c-aci-testing aci remove --deployment-name $depl
            done
          fi
