name: Workload - Sidecar with fragments

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/workload-sidecar-with-fragments/**
      - .github/workflows/workload-sidecar-with-fragments.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/workload-sidecar-with-fragments/**
      - .github/workflows/workload-sidecar-with-fragments.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Sidecar with fragments
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'sidecar-fragment' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboard.azurecr.io
  MANAGED_IDENTITY: cacidashboard
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: 'managed_identity,public_ip,fragment'

jobs:
  workload-sidecar-with-fragments:
    name: ${{ inputs.id || 'workload-sidecar-with-fragments' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Install oras
        run: |
          VERSION="1.2.2"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install/
          tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_${VERSION}_*.tar.gz oras-install/

      - name: Install sign1util
        run: |
          mkdir -p /tmp/cosesign1go
          cd /tmp/cosesign1go
          curl -sL https://github.com/microsoft/cosesign1go/releases/download/v1.4.0/sign1util -o sign1util
          chmod +x sign1util
          echo "PATH=$PATH:/tmp/cosesign1go" >> $GITHUB_ENV

      - name: Use precise current time as tag
        run: |
          export TAG=$(date "+%Y%m%d-%H%M%S.%N")
          echo TAG: $TAG
          . workloads/workload-sidecar-with-fragments/setup_vars.sh

          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "SIDECAR_REPO_A=$SIDECAR_REPO_A" >> $GITHUB_ENV
          echo "SIDECAR_REPO_B=$SIDECAR_REPO_B" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "SIDECAR_TAG=$SIDECAR_TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "SIDECAR_IMAGE_A=$SIDECAR_IMAGE_A" >> $GITHUB_ENV
          echo "SIDECAR_IMAGE_B=$SIDECAR_IMAGE_B" >> $GITHUB_ENV
          echo "FEED=$FEED" >> $GITHUB_ENV

      - name: Build and push image and fragments (make)
        run: |
          ./scripts/tracing/trace_step.py --start 'Build and push image and fragments (make)'
          cd workloads/workload-sidecar-with-fragments
          make

      - name: Deploy
        run: |
          export DEPLOY_SCRIPT=$(realpath scripts/aci_deploy_traced.sh)
          cd workloads/workload-sidecar-with-fragments
          make deploy

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Show fragments and policies
        if: always()
        run: |
          cd workloads/workload-sidecar-with-fragments
          make show

      - name: Verify deployment
        if: always()
        run: |
          set +e
          TRACE_STEP_SCRIPT=$(realpath ./scripts/tracing/trace_step.py)
          $TRACE_STEP_SCRIPT --start 'Verify deployment'
          cd workloads/workload-sidecar-with-fragments
          make verify
          if [ $? -ne 0 ]; then
            $TRACE_STEP_SCRIPT --complete --err 'make verify returned with non-zero exit code' --strict
            exit 1
          fi
          $TRACE_STEP_SCRIPT --complete --strict
          exit 0

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          for depl in ${DEPLOYMENT_NAME}-a ${DEPLOYMENT_NAME}-b ${DEPLOYMENT_NAME}-justsc; do
            DEPLOYMENT_NAME=$depl ./scripts/trace_container_states.sh
          done

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            for depl in ${DEPLOYMENT_NAME}-a ${DEPLOYMENT_NAME}-b ${DEPLOYMENT_NAME}-justsc; do
              c-aci-testing aci remove --deployment-name $depl
            done
          fi
