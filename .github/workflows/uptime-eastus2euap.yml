name: Uptime - East US 2 EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '18 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  uptime:
    secrets: inherit
    uses: ./.github/workflows/uptime.yml
    with:
      location: eastus2euap
