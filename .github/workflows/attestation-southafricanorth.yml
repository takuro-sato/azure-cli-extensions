name: Attestation - South Africa North

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-southafricanorth.yml
  schedule:
    - cron: '26 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-southafricanorth:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: southafricanorth
      policy_type: allow_all
      test_schedule: gh-hourly
