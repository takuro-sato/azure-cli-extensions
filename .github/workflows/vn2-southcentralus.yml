name: VN2 - South Central US

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-southcentralus.yml

jobs:
  vn2-southcentralus:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: southcentralus
      resource_group: vn2-aks-southcentralus
      aks_cluster_name: vn2-aks-southcentralus
