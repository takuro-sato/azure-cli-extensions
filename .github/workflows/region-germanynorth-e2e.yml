name: Region - Germany North E2E

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '36 8 * * *'
  workflow_dispatch:
    inputs:
      run_known_broken_tests:
        type: boolean
        description: Whether to run C-WCOW tests that are known to fail
        default: false
  pull_request:
    paths:
      - .github/workflows/region-germanynorth-e2e.yml

jobs:
  basic-lcow-germanynorth-e2e:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: germanynorth
      environment: cacitesting.e2e.env

  basic-cwcow-germanynorth-e2e:
    secrets: inherit
    uses: ./.github/workflows/basic-region-cwcow.yml
    with:
      location: germanynorth
      environment: cacitesting.e2e.env

  lcow-germanynorth-e2e:
    secrets: inherit
    uses: ./.github/workflows/region.yml
    with:
      location: germanynorth
      environment: cacitesting.e2e.env

  cwcow-germanynorth-e2e:
    secrets: inherit
    uses: ./.github/workflows/region-cwcow.yml
    with:
      location: germanynorth
      environment: cacitesting.e2e.env
      run_known_broken_tests: ${{ inputs.run_known_broken_tests || false }}
