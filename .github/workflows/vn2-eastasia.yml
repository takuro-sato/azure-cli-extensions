name: VN2 - East Asia

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '6 18 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-eastasia:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: eastasia
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-eastasia
