name: VN2 - East Asia

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-eastasia.yml

jobs:
  vn2-eastasia:
    secrets: inherit
    uses: ./.github/workflows/vn2-helloworld.yml
    with:
      location: eastasia
      resource_group: vn2-aks-eastasia
      aks_cluster_name: vn2-aks-eastasia
