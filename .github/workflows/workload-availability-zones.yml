name: Workload - Availability Zones

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/availability_zones
      - .github/workflows/workload-availability-zones.yml
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/availability_zones
      - .github/workflows/workload-availability-zones.yml
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The availability zone to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      zone:
        type: string
        description: The availability zone to deploy to
        required: true
      cpu:
        type: number
        description: The number of CPU cores in container
        default: 2
      memory_in_gb:
        type: number
        description: The memory in container in Gb
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: Availability Zones
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'zones' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboard.azurecr.io
  MANAGED_IDENTITY: cacidashboard
  LOCATION: ${{ inputs.location || 'westeurope' }}
  ZONE: ${{ inputs.zone || '1' }}
  CPU: ${{ inputs.cpu || 2 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}

jobs:
  availability_zones:
    name: ${{ inputs.id || 'availability_zones' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Pull Image
        run: c-aci-testing images pull workloads/availability_zones

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/availability_zones --parameter "zone='$ZONE'"
          c-aci-testing aci param_set workloads/availability_zones --parameter cpu=$CPU
          c-aci-testing aci param_set workloads/availability_zones --parameter memoryInGb=$MEMORY_IN_GB

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/availability_zones --deployment-name $DEPLOYMENT_NAME
          cat workloads/availability_zones/policy_availability_zones.rego

      - name: Deploy Container Group
        run: |
          ./scripts/tracing/trace_step.py --start 'Deploy Container Group'
          c-aci-testing aci deploy workloads/availability_zones --deployment-name $DEPLOYMENT_NAME

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Check zones in resource is correct
        run: |
          ./scripts/tracing/trace_step.py --start 'Check zones in resource is correct'
          DEPLOYED_ZONE=$(az container show --name $DEPLOYMENT_NAME --resource-group $RESOURCE_GROUP --query 'zones' | jq -r '.[]')
          if [ "$DEPLOYED_ZONE" != "$ZONE" ]; then
            echo "Deployed to zone $DEPLOYED_ZONE, expected $ZONE"
            ./scripts/tracing/trace_step.py --complete --err "Deployed to zone $DEPLOYED_ZONE, expected $ZONE"
            exit 1
          fi
          ./scripts/tracing/trace_step.py --complete
          exit 0

      - name: Monitor Container Group
        if: always()
        continue-on-error: true
        run: c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME --follow

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          sleep 60 # Ensure all states are up to date
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
