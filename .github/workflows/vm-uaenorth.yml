name: VM - UAE North

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vm-uaenorth.yml

jobs:
  vm-uaenorth:
    secrets: inherit
    uses: ./.github/workflows/vm-region.yml
    with:
      location: uaenorth
