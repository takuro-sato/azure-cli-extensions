name: Attestation - East Asia

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '9 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-eastasia:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: eastasia
      policy_type: allow_all
