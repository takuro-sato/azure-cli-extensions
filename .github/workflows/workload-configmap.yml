name: Workload - ConfigMap

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/configmap/**
      - .github/workflows/workload-configmap.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/configmap/**
      - .github/workflows/workload-configmap.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment file to load
        default: cacitesting.env
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: ConfigMap
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'configmap' }}-${{ inputs.location }}-${{ github.run_number }}
  REGISTRY: mcr.microsoft.com
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  TAG: '3.0'
  RUN_FEATURES: configmap

jobs:
  configmap:
    name: ${{ inputs.id || 'configmap' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment
        id: environment
        run: ./scripts/load_environment.sh "${{ inputs.environment || 'cacitesting.env' }}" REGISTRY

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.environment.outputs.subscription }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Pull Image
        if: ${{ env.POLICY_TYPE != 'allow_all' }}
        run: c-aci-testing images pull workloads/configmap

      - name: Generate Config
        run: |
          config=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 20)
          echo "CONFIG_RAW=$config" >> $GITHUB_ENV

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/configmap --parameter "myconfig='$CONFIG_RAW'"

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/configmap --deployment-name $DEPLOYMENT_NAME
          cat workloads/configmap/policy_configmap.rego

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/configmap

      - name: Monitor Container Group
        run: |
          sleep 20
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log

      - name: Find config in output
        run: |
          ./scripts/tracing/trace_step.py --start 'Find config in output'
          found=false
          grep -Fq "$CONFIG_RAW" output.log && found=true
          if [[ $found == true ]]; then
            echo "Config found in output"
            ./scripts/tracing/trace_step.py --complete --strict
          else
            echo "Config not found in output"
            ./scripts/tracing/trace_step.py --complete --strict --err 'Expected config value not found in output'
          fi

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
