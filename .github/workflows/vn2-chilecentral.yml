name: VN2 - Chile Central

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '58 17 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-chilecentral.yml

jobs:
  vn2-chilecentral:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: chilecentral
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-chilecentral
