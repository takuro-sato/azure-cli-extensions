name: Region (Basic) - South Africa West

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/basic-region-southafricawest.yml
  schedule:
    - cron: '34 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  basic-southafricawest:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: southafricawest
