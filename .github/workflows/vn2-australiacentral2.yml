name: VN2 - Australia Central 2

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 1-23/2 * * *'
  workflow_dispatch:

jobs:
  vn2-australiacentral2:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: australiacentral2
      resource_group: vn2-aks-australiacentral2
      aks_cluster_name: vn2-aks-australiacentral2
