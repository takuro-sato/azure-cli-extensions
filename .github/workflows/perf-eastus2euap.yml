name: Perf - East US 2 EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '35 7 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-eastus2euap.yml

jobs:
  perf-eastus2euap:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: eastus2euap
