name: Perf - East US 2 EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-eastus2euap.yml

jobs:
  perf-eastus2euap:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: eastus2euap
