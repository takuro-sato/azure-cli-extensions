name: Workload - Stress Tests (No server)

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/stress_tests_noserver
      - .github/workflows/workload-stress-tests-noserver.yml
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/stress_tests_noserver
      - .github/workflows/workload-stress-tests-noserver.yml
      - scripts/install-c-aci-testing.sh
    branches:
      - main
      - tingmao/stress-test-nocurl
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The total number of CPU cores
        default: 4
      memory_in_gb:
        type: number
        description: The total amount of memory in GB
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: choice
        description: The type of policy to use
        default: allow_all
        options:
          - generated
          - debug
          - allow_all
      script:
        type: choice
        description: The script to run
        default: workload_fio
        options:
          - workload_cpu
          - workload_cpu_fio
          - workload_exec
          - workload_fio
          - workload_multicpu_fio
          - workload_tar
      useNormalSidecar:
        type: boolean
        default: false
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cpu:
        type: number
        description: The total number of CPU cores
        default: 4
      memory_in_gb:
        type: number
        description: The total amount of memory in GB
        default: 4
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: allow_all
      script:
        type: string
        description: The script to run
        default: workload_fio
      useNormalSidecar:
        type: boolean
        default: true

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: ${{ github.workflow }}
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'stress-nosrv' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboard.azurecr.io
  MANAGED_IDENTITY: cacidashboard
  LOCATION: ${{ inputs.location || 'westus' }}
  CPU: ${{ inputs.cpu || 4 }}
  MEMORY_IN_GB: ${{ inputs.memory_in_gb || 4 }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'allow_all' }}
  SCRIPT: ${{ inputs.script || 'workload_fio' }}
  REPO_BASE: stress_tests_noserver
  USE_NORMAL_SIDECAR: ${{ inputs.useNormalSidecar || true }}
  ACI_EXPECTED_KERNEL_DATE: ${{ vars.ACI_EXPECTED_KERNEL_DATE }}

jobs:
  stress-tests-noserver:
    name: ${{ inputs.id || 'stress-tests-noserver' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Use precise current time as tag
        run: |
          TAG=$(date "+%Y%m%d-%H%M%S.%N")
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build image
        run: c-aci-testing images build workloads/stress_tests_noserver

      - name: Push image
        run: c-aci-testing images push workloads/stress_tests_noserver

      - name: Set Parameters
        run: |
          c-aci-testing aci param_set workloads/stress_tests_noserver --parameter totalCpus=$CPU
          c-aci-testing aci param_set workloads/stress_tests_noserver --parameter totalMemoryGB=$MEMORY_IN_GB
          c-aci-testing aci param_set workloads/stress_tests_noserver --parameter "script='$SCRIPT'"
          c-aci-testing aci param_set workloads/stress_tests_noserver --parameter "repo_base='$REPO_BASE'"
          c-aci-testing aci param_set workloads/stress_tests_noserver --parameter "useNormalSidecar=$USE_NORMAL_SIDECAR"
          echo stress_tests.bicepparam:
          cat workloads/stress_tests_noserver/stress_tests.bicepparam

      - name: Generate Security Policy
        run: |
          ./scripts/tracing/trace_step.py --start 'Generate Policy'
          c-aci-testing policies gen workloads/stress_tests_noserver --deployment-name $DEPLOYMENT_NAME
          cat workloads/stress_tests_noserver/policy_stress_tests.rego

      - name: Deploy Container Group
        run: |
          ./scripts/tracing/trace_step.py --start 'Deploy Container Group'
          c-aci-testing aci deploy workloads/stress_tests_noserver --deployment-name $DEPLOYMENT_NAME

      - name: Let container run for some time
        run: sleep 100

      - name: Monitor Container Group
        run: |
          ./scripts/tracing/trace_step.py --start 'Monitor Container Group'
          rm -f output.log
          c-aci-testing aci monitor --deployment-name $DEPLOYMENT_NAME | tee output.log

      - name: Check correct kernel version
        run: |
          ./scripts/tracing/trace_step.py --start 'Check Kernel Version'
          ./scripts/check_uname_in_output.sh output.log

      - name: Check output and dmesg
        run: |
          ./scripts/tracing/trace_step.py --start 'Check Output and dmesg'

          grep -q -F 'Stress test container alive' output.log || no_alive_output=true
          if [ -n "$no_alive_output" ]; then
            echo "No 'Stress test container alive' message found in output.log"
            exit 1
          fi
          dmesg_file="output.log"

          found_sus_message=""
          grep -i segfault $dmesg_file && found_sus_message="segfault"
          grep -i 'protection fault' $dmesg_file && found_sus_message="protection-fault"
          grep 'BUG:' $dmesg_file && found_sus_message="kernel-bug"
          grep 'RIP:' $dmesg_file && found_sus_message="kernel-backtrace"

          if [ -n "$found_sus_message" ]; then
            echo "Found suspicious message in dmesg: $found_sus_message"
            exit 1
          fi

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          az container show \
            --resource-group $RESOURCE_GROUP \
            --name $DEPLOYMENT_NAME \
          | jq -c '.containers[]' | while read -r container; do
            container_name=$(echo "$container" | jq -r '.name')
            echo "Events for container $container_name:"
            echo "$container" | jq -r '.instanceView | .events[]'
          done

      - name: Remove Container Group
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
