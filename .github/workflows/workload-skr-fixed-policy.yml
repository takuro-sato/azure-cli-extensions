name: Workload - SKR Fixed Policy

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - workloads/skr-fixed-policy/**
      - workloads/skr/attestation.py
      - workloads/skr/key.py
      - containers/skr_proxy.Dockerfile
      - containers/skr_proxy.py
      - .github/workflows/workload-skr-fixed-policy.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
  push:
    paths:
      - workloads/skr-fixed-policy/**
      - workloads/skr/attestation.py
      - workloads/skr/key.py
      - containers/skr_proxy.Dockerfile
      - containers/skr_proxy.py
      - .github/workflows/workload-skr-fixed-policy.yml
      - scripts/init_run.sh
      - scripts/install-c-aci-testing.sh
    branches:
      - main
  workflow_dispatch:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
  workflow_call:
    inputs:
      id:
        type: string
        description: ID of the run
      location:
        type: string
        description: Where to deploy to
        required: true
      cleanup:
        type: boolean
        description: Whether to cleanup the container group after testing
        default: true
      policy_type:
        type: string
        description: The type of policy to use
        default: generated
      test_schedule:
        type: string
        description: Trace marker by scheduled runs only
        default: ''

env:
  KUSTO_CONNECTION_STRING: ${{ secrets.KUSTO_CONNECTION_STRING }}
  KUSTO_DATABASE: ${{ secrets.KUSTO_DATABASE }}
  KUSTO_TABLE: CACITestStepTrace
  TEST_TYPE: aci
  TEST_NAME: SKR Fixed Policy
  RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DEPLOYMENT_NAME: ${{ inputs.id || 'skr-fixed-policy' }}-${{ inputs.location }}-${{ github.run_number }}
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION_ACI }}
  RESOURCE_GROUP: c-aci-dashboard
  REGISTRY: cacidashboardaci.azurecr.io
  REPOSITORY: prebuilt-test-containers
  MANAGED_IDENTITY: cacidashboard-${{ inputs.location || 'westeurope' }}
  # Pinned to a dedicated tag (not 'latest') so future pushes to
  # skr_proxy:latest do not invalidate the hard-coded CCE policy in
  # workloads/skr-fixed-policy/policy_skr_fixed_policy.rego.
  TAG: skr-fixed-policy
  LOCATION: ${{ inputs.location || 'westeurope' }}
  CLEANUP: ${{ inputs.cleanup }}
  POLICY_TYPE: ${{ inputs.policy_type || 'generated' }}
  ATTESTATION_ENDPOINT: ${{ vars.ATTESTATION_ENDPOINT }}
  HSM_ENDPOINT: ${{ vars.HSM_ENDPOINT_ACI }}
  TEST_SCHEDULE: ${{ inputs.test_schedule }}
  RUN_FEATURES: 'managed_identity,public_ip'

jobs:
  server:
    name: ${{ inputs.id || 'skr-fixed-policy' }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Initialize Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/init_run.sh

      - name: Deploy Container Group
        run: |
          ./scripts/aci_deploy_traced.sh workloads/skr-fixed-policy

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ACI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ACI }}

      - name: Test SKR
        run: |
          set +e -o pipefail
          ./scripts/tracing/trace_step.py --start 'Test SKR' || exit 1
          python -m unittest discover -s workloads/skr-fixed-policy 2>&1 | tee skr_test.log
          status=$?
          if [ $status -ne 0 ]; then
            maybe_err=(--err "SKR test failed")
          else
            maybe_err=()
          fi
          jq -Rs '{skrTestLog: .}' < skr_test.log | \
            ./scripts/tracing/trace_step.py --complete "${maybe_err[@]}" --output-from-stdin || exit 1
          exit $status

      - name: Report result
        if: always()
        run: |
          ./scripts/trace_run_result.sh ${{ job.status }}

      - name: Get Container States
        if: always()
        continue-on-error: true
        run: |
          ./scripts/trace_container_states.sh

      - name: Remove Container Group
        if: always()
        run: |
          if [ "$CLEANUP" != false ]; then
            c-aci-testing aci remove --deployment-name $DEPLOYMENT_NAME
          fi
