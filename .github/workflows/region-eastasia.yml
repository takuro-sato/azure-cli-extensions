name: Region - East Asia

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '40 3 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/region-eastasia.yml

jobs:
  eastasia:
    secrets: inherit
    uses: ./.github/workflows/region.yml
    with:
      location: eastasia
