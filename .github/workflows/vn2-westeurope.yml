name: VN2 - West Europe

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vn2-westeurope.yml

jobs:
  vn2-westeurope:
    secrets: inherit
    uses: ./.github/workflows/vn2-helloworld.yml
    with:
      location: westeurope
      resource_group: vn2-aks-westeurope
      aks_cluster_name: vn2-aks-westeurope
