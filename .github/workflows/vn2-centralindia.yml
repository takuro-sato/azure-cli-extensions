name: VN2 - Central India

permissions:
   id-token: write
   contents: read

on:
  schedule:
    - cron: '13 21 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  vn2-centralindia:
    secrets: inherit
    uses: ./.github/workflows/vn2-region.yml
    with:
      location: centralindia
      resource_group: c-aci-vn2
      aks_cluster_name: vn2-aks-centralindia
