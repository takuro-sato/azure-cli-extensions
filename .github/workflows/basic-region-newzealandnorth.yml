name: Region (Basic) - New Zealand North

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/basic-region-newzealandnorth.yml

jobs:
  basic-newzealandnorth:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: newzealandnorth
