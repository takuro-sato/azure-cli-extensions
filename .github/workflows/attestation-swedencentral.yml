name: Attestation - Sweden Central

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '29 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-swedencentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: swedencentral
      policy_type: allow_all
      test_schedule: gh-hourly
