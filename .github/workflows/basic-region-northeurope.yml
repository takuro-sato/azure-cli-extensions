name: Region (Basic) - North Europe

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '40 2 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/basic-region-northeurope.yml

jobs:
  basic-northeurope:
    secrets: inherit
    uses: ./.github/workflows/basic-region.yml
    with:
      location: northeurope
