name: Perf - Japan East

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf-japaneast.yml

jobs:
  perf-japaneast:
    secrets: inherit
    uses: ./.github/workflows/perf-region.yml
    with:
      location: japaneast
