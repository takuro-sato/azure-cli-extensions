name: Attestation - Central US EUAP

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '7 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-centraluseuap:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: centraluseuap
      policy_type: allow_all
