name: Attestation - Central US EUAP

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-centraluseuap.yml
  schedule:
    - cron: '13 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-centraluseuap:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: centraluseuap
      policy_type: allow_all
      test_schedule: gh-hourly
