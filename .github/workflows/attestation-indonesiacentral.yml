name: Attestation - Indonesia Central

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/attestation-indonesiacentral.yml
  schedule:
    - cron: '23 1-23 * * *'  # managed by scripts/spread_out_schedules.py
  workflow_dispatch:

jobs:
  attestation-indonesiacentral:
    secrets: inherit
    uses: ./.github/workflows/workload-attestation.yml
    with:
      location: indonesiacentral
      policy_type: allow_all
      test_schedule: gh-hourly
