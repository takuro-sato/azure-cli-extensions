apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-with-skr-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: example-with-skr-sidecar
  template:
    metadata:
      labels:
        deployment: example-with-skr-sidecar
      annotations:
        microsoft.containerinstance.virtualnode.ccepolicy: ""
    spec:
      containers:
      - name: primary
        image: mcr.microsoft.com/azurelinux/base/core:3.0
        resources:
          requests:
            memory: "2G"
            cpu: "1"
        command:
          - sh
          - -c
          - |
            while :; do
              echo
              echo
              echo
              curl -sSLv --data '{"runtime_data": "aGkK"}' http://127.0.0.1:8080/attest/raw
              status=$?
              echo # Adds a new line since the above endpoint doesn't
              if [ $status -ne 0 ]; then
                echo "curl failed"
                sleep 5
              else
                echo "curl succeeded"
                sleep 60
              fi
            done
      - name: skr
        image: mcr.microsoft.com/aci/skr:2.12
        resources:
          requests:
            memory: "0.5G"
            cpu: "0.5"
      nodeSelector:
        virtualization: virtualnode2
      tolerations:
        - key: "virtual-kubelet.io/provider"
          operator: "Exists"
          effect: "NoSchedule"
